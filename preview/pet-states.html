<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>小虹 · 五角色 × 六状态</title>
<style>
/**
 * 桌宠「小虹」：纯 CSS 几何临摹的五月天「吧唧球」风格彩色圆球。
 *
 * 分层是有意的，因为三层的「谁拥有 transform」必须分清：
 * - `.motion` —— **JS 拥有**：挤压回弹、拖拽摆动（直接写 style）；
 * - `.body`  —— **CSS 拥有**：状态动画（呼吸 / 忙碌 / 庆祝 / 抖动 / 打盹）；
 * - `.eye`   —— 眨眼；瞳孔与两处高光由 JS 直接写 `transform` 跟随指针
 *   （不写继承型自定义属性：那会让整棵子树每帧失效重算）。
 *
 * 形象逻辑：五颗球 = 五个可选角色（红/黄/粉/蓝/绿，经 `petBall` 偏好
 * 选择、`data-ball` 下发）——球色是身份，不随状态变化；表情（眼形/
 * 瞳色/嘴形/眼镜/汗滴）才随会话状态切换。吧唧球的脸没有眉毛呆毛，
 * 情绪全靠球色 + 眼形瞳色 + 嘴形表达。打盹是当前球色的调暗版。
 *
 * 质感按「光滑胶皮球」叠层：`.sheen` 负责球面反光（大高光 + 小星点 +
 * 底部暗部），`.rim` 负责轮廓（外圈深色描边让浅色主题下也勾得住形，
 * 内圈亮边勾体积）。
 *
 * 配色：五个球色是画作，固定不变；气泡与菜单走宿主 `--dsw-alias-*`
 * 令牌，深浅主题自动跟随。
 */

.pet {
  position: fixed;
  z-index: 40;

  /* ——— 动效语言 ———
     时长与曲线抽成 token：新动画有参照系，手感不会随时间漂。
     参考 Material 3 的 motion tokens：短 150ms / 中 300ms / 长 500ms 三档，
     配三条曲线（标准 / 强调 / 回弹）。 */
  --pet-dur-fast: 160ms;
  --pet-dur-base: 320ms;
  --pet-dur-slow: 620ms;
  --pet-ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --pet-ease-emphasized: cubic-bezier(0.2, 0.9, 0.3, 1);
  --pet-ease-elastic: cubic-bezier(0.34, 1.4, 0.64, 1);
  /* 覆盖层本身是点击穿透的：只有角色本体重新接回指针事件。 */
  pointer-events: none;
  width: var(--dsh-pet-size, 104px);
  height: var(--dsh-pet-size, 104px);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  /* 隔离：宿主样式改不动桌宠内部，桌宠的重算也不会外溢到宿主。
     不加 paint —— 气泡与菜单要能溢出到桌宠盒子外。 */
  contain: layout style;
}

.hit {
  all: unset;
  box-sizing: border-box;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: grab;
  pointer-events: auto;
  touch-action: none;
  border-radius: 50%;
  /* 被拎起来时整只轻微放大——「被抓在手心」的捏起感。 */
  transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
}

.pet[data-dragging='true'] .hit {
  transform: scale(1.045);
}

.hit:active {
  cursor: grabbing;
}

.hit:focus-visible {
  outline: 2px solid var(--dsw-alias-brand-primary, light-dark(#0f1115, #f9fafb));
  outline-offset: 4px;
}

/* 形变分层：每一层只拥有一个 transform，谁也抢不走谁。
   - .motion —— CSS 拥有：入场动画与连戳转圈；
   - .swing  —— JS 拥有：拖拽摆动（跟着惯性歪）；
   - .squash —— JS 拥有：挤压回弹（Web Animations API，可取消）。
   以前 JS 与 CSS 都写 .motion 的 transform，CSS 动画优先级更高——
   戳击回弹会被入场动画直接吞掉。 */
.motion {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transform-origin: 50% 90%;
}

/* JS 摆动层：绝对定位，不参与布局（.body 的盒子不受影响）。 */
.swing {
  position: absolute;
  inset: 0;
  display: block;
  transform-origin: 50% 90%;
}

/* JS 挤压层：同上。 */
.squash {
  position: absolute;
  inset: 0;
  display: block;
  transform-origin: 50% 90%;
}

/* 拖拽中才提层：平时不留常驻合成层。 */
.pet[data-dragging='true'] .swing,
.pet[data-dragging='true'] .squash {
  will-change: transform;
}

/* 状态光环：随状态换色，庆祝时更亮。 */
.aura {
  position: absolute;
  inset: 4%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--pet-aura, rgba(217, 73, 61, 0.22)) 0%, transparent 70%);
  filter: blur(9px);
  opacity: 0.8;
  /* 只过渡透明度：过渡 background 会让整块模糊每帧重算。 */
  transition: opacity 0.3s ease;
  pointer-events: none;
  animation: pet-aura 3.6s ease-in-out infinite;
  --pet-aura-scale: 1.06;
}

.body {
  position: relative;
  display: block;
  width: 80%;
  height: 80%;
  margin: 0 auto 8%;
  /* 宿主的全局后代规则（`button span` 一类）会压过单哈希类，把球的
     border-radius 改成宿主的圆角矩形——旧水滴版早已被改成圆角方块，
     只是水滴看不出来；球一眼就穿帮。对策：球面全部画在 ::before 上
     ——伪元素不匹配 `button span` 这类元素选择器，宿主够不着；
     常规防护（::before 的 50% 半径 + sheen/rim 的 !important）兜住其余层。
     注意不要用 clip-path 钉形状：裁剪加在带循环动画的本体上，缩放帧
     会把 rim 轮廓光栅化成球面「缝线」（实测）。 */
  border-radius: 50% !important;
  /* 投影挂在本体上：球面移到了 ::before（见其注释）。本体形状被宿主
     改写也只影响这层柔影的轮廓，18px 模糊下方圆难辨。 */
  box-shadow: 0 8px 18px light-dark(#0f111526, #00000059);
  transform-origin: 50% 90%;
  /* .body 几乎一直在动（呼吸/点头/跳跃），常驻提层是划算的；
     .motion 只在入场与转圈时动，那里改成按需。 */
  will-change: transform;
  /* 悬停时球面微微提亮——「注意到你了」的一层反应，不是动效。 */
  transition: filter 0.25s ease;
}

/* 球面本体（红球默认色）：伪元素层 + 双保险形状。
   一、四条 longhand 半径——只改写 `border-radius:` shorthand 的宿主样式碰不到；
   二、clip-path 出正圆——与 radius 体系完全无关，宿主改写 radius 也无效。
   clip 必须加在「自身无动画」的伪元素上：clip 与元素自身动画叠加会在
   缩放帧产生光栅化接缝（实测），而伪元素只随 body 的动画整体移动。
   投影因此上移到 .body 本体（clip 会裁掉伪元素外面的阴影）。 */
.body::before {
  content: '';
  position: absolute;
  inset: 0;
  border-top-left-radius: 50% !important;
  border-top-right-radius: 50% !important;
  border-bottom-left-radius: 50% !important;
  border-bottom-right-radius: 50% !important;
  clip-path: circle(50%);
  background: radial-gradient(circle at 33% 27%, #ea6a5b 0%, #d9493d 52%, #bd352b 100%);
}

.pet:hover .body {
  filter: brightness(1.045);
}

/* 五个角色的球色：色相对齐参考图实测值（粉 #e76ca3 / 黄 #f1cc3d /
   红 #da361d / 绿 #1ca939 / 蓝 #2ba6e1），仍保留径向渐变的体积感。 */
.pet[data-ball='yellow'] .body::before {
  background: radial-gradient(circle at 33% 27%, #f7d75a 0%, #f1cc3d 52%, #d9b32c 100%);
}

.pet[data-ball='pink'] .body::before {
  background: radial-gradient(circle at 33% 27%, #ef7fb4 0%, #e76ca3 52%, #cf5a90 100%);
}

.pet[data-ball='blue'] .body::before {
  background: radial-gradient(circle at 33% 27%, #45b4ea 0%, #2ba6e1 52%, #1c8ac4 100%);
}

.pet[data-ball='green'] .body::before {
  background: radial-gradient(circle at 33% 27%, #2fc44a 0%, #1ca939 52%, #128c2c 100%);
}

/* 球面反光：让圆球有体积感。
   五层光——左上大高光（主反射）、高光里的小星点（第二反射）、
   右下暗部（球背光面）、底缘接触暗影（球「坐」在地上的重量）、
   再往上一线地面反光（桌面把光弹回来）。
   渐变终点一律用同色相的 0 alpha（`transparent` 会经 rgba(0,0,0,0)
   插值出灰边，高光就「贴」上去了）。
   高光整体跟着呼吸轻微漂移（pet-sheen），球面就有了「活的反光」。 */
.sheen {
  position: absolute;
  inset: 0;
  /* 同 .body::before：longhand + clip 双保险。 */
  border-top-left-radius: 50% !important;
  border-top-right-radius: 50% !important;
  border-bottom-left-radius: 50% !important;
  border-bottom-right-radius: 50% !important;
  clip-path: circle(50%);
  background:
    radial-gradient(40% 28% at 31% 19%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 100%),
    radial-gradient(11% 8% at 24% 12%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0) 100%),
    radial-gradient(84% 58% at 68% 94%, rgba(15, 20, 30, 0.18), rgba(15, 20, 30, 0) 100%),
    radial-gradient(52% 20% at 50% 100%, rgba(15, 20, 30, 0.1), rgba(15, 20, 30, 0) 100%),
    radial-gradient(74% 24% at 50% 105%, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
  animation: pet-sheen 5.6s ease-in-out infinite;
  --pet-sheen-shift: -1%;
}

/* 轮廓：外圈深色细描边（浅色主题下把形从亮背景里勾出来），
   内圈亮边（玻璃边缘的全反射）。 */
.rim {
  position: absolute;
  inset: 0;
  /* 同 .body::before：longhand + clip 双保险，轮廓环被改写也裁回正圆。 */
  border-top-left-radius: 50% !important;
  border-top-right-radius: 50% !important;
  border-bottom-left-radius: 50% !important;
  border-bottom-right-radius: 50% !important;
  clip-path: circle(50%);
  box-shadow:
    0 0 0 1px light-dark(#0f111545, #00000066),
    inset 0 0 0 1.5px rgba(255, 255, 255, 0.42);
  pointer-events: none;
}

.face {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* 眼睛：白眼白 + 彩色圆瞳（吧唧球的脸），瞳孔跟着指针挪。
   几何由各角色的变量给出（--eye-* / --iris-*），状态切换只改 scale / translate，
   不动布局盒——所以换表情永远不触发重排。 */
.eyeLeft,
.eyeRight {
  position: absolute;
  top: var(--eye-top, 37%);
  width: var(--eye-w, 18%);
  height: var(--eye-h, 22%);
  border-radius: var(--eye-radius, 50%);
  background: var(--eye-bg, radial-gradient(circle at 50% 32%, #ffffff 0%, rgba(255, 255, 255, 0.97) 62%, rgba(226, 228, 220, 0.95) 100%));
  box-shadow: inset 0 1.5px 2px rgba(15, 17, 21, 0.12);
  overflow: hidden;
  transform-origin: center;
  animation: pet-blink var(--pet-blink-period, 7.4s) ease-in-out infinite;
  /* 状态换脸时眼睛渐变过渡（大小/位置/描边/镜圈），不是瞬切——表情是「变」过去的。
     大小与位置走 scale / translate（合成属性，不触发 layout）；描边与底色是绘制属性。
     transform 留给眨眼（pet-blink 动的是 transform），两者互不覆盖。 */
  transition:
    scale var(--pet-dur-base) var(--pet-ease-elastic),
    translate var(--pet-dur-base) var(--pet-ease-elastic),
    border-color var(--pet-dur-base) var(--pet-ease-standard),
    border-width var(--pet-dur-base) var(--pet-ease-standard),
    border-radius var(--pet-dur-base) var(--pet-ease-standard),
    background-color var(--pet-dur-base) var(--pet-ease-standard);
}

.eyeLeft {
  left: var(--eye-left, 25%);
}

/* 上眼睑：黄球的招牌——半垂着眼，虹膜只露下半。
   眼皮用球面本色画（盖住虹膜的上半），高度由 --lid-h 控制。 */
.eyeLeft::after,
.eyeRight::after {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: var(--lid-h, 0%);
  background: var(--lid-color, transparent);
  border-radius: 50% 50% 40% 40% / 60% 60% 30% 30%;
  pointer-events: none;
}

.eyeRight {
  right: var(--eye-right, 25%);
}

.pupil {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--iris-w, 66%);
  height: var(--iris-h, 66%);
  margin: var(--iris-mx, -33%) 0 0 var(--iris-my, -33%);
  border-radius: 50%;
  /* 虹膜：每个角色一套（色相、大小都不同）。 */
  background: var(--iris, radial-gradient(circle at 42% 36%, #55bd6e 0%, #2f9e50 62%));
  /* 初值；实际位移由 JS 写内联 transform（直接写元素，失效范围最小）。 */
  transform: translate(0, 0);
  /* 丝滑的关键：视线永远在「滑」，不在「跳」。曲线要长而软，
     指针跟随像目光被牵过去，扫视像目光自己溜达过去。 */
  transition:
    transform var(--pet-dur-base) cubic-bezier(0.25, 0.75, 0.3, 1),
    scale var(--pet-dur-base) var(--pet-ease-elastic),
    translate var(--pet-dur-base) var(--pet-ease-elastic);
}

/* 高光点：参考图里五只球的眼睛都是平涂（纯白眼 + 纯色虹膜），没有高光——
   留着它反而让脸「不像那只球」。默认关掉。 */
.glint,
.glintDot {
  display: none;
}

/* 各角色的招牌瞳色在角色段落里给（--iris）：红球绿瞳、黄球红瞳、粉球蓝瞳、
   蓝球深瞳、绿球橙瞳——与参考图实测一致。 */

/* 腮红：radial 晕染而非实心块——像皮下透出来的红，边缘必须消失于无形。 */
.blush {
  position: absolute;
  top: 56%;
  width: 19%;
  height: 11%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 122, 152, 0.52) 0%, rgba(255, 122, 152, 0) 72%);
  opacity: 0.45;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.blushLeft {
  left: 13%;
}

.blushRight {
  right: 13%;
}

/* 嘴：默认是「撇嘴」——一根微倾的短棒 + 左端往下收的小钩，
   红球默认脸的傲娇细节。状态换脸时整个换形状（见状态段）。 */
.mouth {
  position: absolute;
  top: var(--mouth-top, 62%);
  left: 50%;
  width: var(--mouth-w, 13%);
  height: var(--mouth-h, 4%);
  margin-left: var(--mouth-left, -6.5%);
  border-radius: var(--mouth-radius, 3px);
  border-bottom: var(--mouth-border, none);
  background: var(--mouth-bg, light-dark(#20242a, #101214));
  transform: rotate(var(--mouth-rot, -7deg));
  transition:
    transform var(--pet-dur-base) var(--pet-ease-standard),
    border-radius var(--pet-dur-base) var(--pet-ease-standard),
    scale var(--pet-dur-base) var(--pet-ease-elastic),
    translate var(--pet-dur-base) var(--pet-ease-elastic),
    background-color var(--pet-dur-base) var(--pet-ease-standard);
}

/* 嘴的附件：每个角色用它做自己的形状（粉=第二个波浪、黄=嘴角黑块、
   红=上翘的小勾、绿=锯齿的折角、蓝=v 嘴的第二笔）。默认不画。 */
.mouth::before {
  content: '';
  position: absolute;
  display: var(--mouth-accent, none);
  left: var(--mouth-accent-x, -16%);
  top: var(--mouth-accent-y, 28%);
  width: var(--mouth-accent-w, 42%);
  height: var(--mouth-accent-h, 3px);
  border-radius: var(--mouth-accent-radius, 3px);
  border-bottom: var(--mouth-accent-border, none);
  background: var(--mouth-accent-bg, inherit);
  transform: var(--mouth-accent-transform, rotate(48deg));
  transform-origin: var(--mouth-accent-origin, right center);
}

/* 舌头：庆祝大笑时从嘴底露出一小片。 */
.tongue {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 40%;
  height: 42%;
  margin-left: -20%;
  border-radius: 46% 46% 52% 52%;
  background: #ff8787;
  display: none;
}

/* 影子：径向两层衰减——中心实、边缘散，比平涂一块更贴「软着地」。 */
.shadow {
  position: absolute;
  bottom: 2%;
  left: 50%;
  width: 44%;
  height: 6%;
  margin-left: -22%;
  border-top-left-radius: 50% !important;
  border-top-right-radius: 50% !important;
  border-bottom-left-radius: 50% !important;
  border-bottom-right-radius: 50% !important; /* 同上：影子是椭圆，longhand + 裁剪双保险。 */
  clip-path: ellipse(50% 50%);
  background: radial-gradient(closest-side, light-dark(#0f111533, #00000059) 0%, light-dark(#0f111514, #0000002e) 62%, light-dark(#0f111500, #00000000) 100%);
  filter: blur(2px);
  pointer-events: none;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

/* 说话气泡：状态一句话，悬停 / 被戳 / 状态突变时出现。
   `--pet-edge-shift` 是贴边修正量：宠物靠边时整体往里推，别被裁掉。
   出现时从球顶轻轻「顶」出来（上移 + 微放大），不是干巴巴地淡入。 */
.bubble {
  position: absolute;
  left: 50%;
  bottom: 94%;
  transform: translateX(calc(-50% + var(--pet-edge-shift, 0px))) translateY(6px) scale(0.94);
  transform-origin: 50% 100%;
  /* 气泡的宽度不靠「收缩到合适」算：绝对定位元素的收缩宽度在
     overflow-wrap: anywhere 下会被压成一个字宽（实测气泡竖成一条）。
     直接按内容宽度给值、再用 max-width 封顶——短句自然宽，
     长句到 220px 后折行。 */
  width: max-content;
  max-width: 220px;
  white-space: normal;
  overflow-wrap: break-word;
  padding: 7px 12px;
  border-radius: 14px;
  background: var(--dsw-alias-bg-module-platform, light-dark(#f9fafb, #353638));
  border: 1px solid var(--dsw-alias-border-l1, light-dark(#0000000a, #ffffff0f));
  box-shadow: 0 4px 12px light-dark(#0f111526, #00000059);
  color: var(--dsw-alias-label-primary, light-dark(#0f1115, #f9fafb));
  font-size: 12px;
  line-height: 18px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s var(--pet-ease-emphasized);
}

.bubble[data-visible='true'] {
  opacity: 1;
  transform: translateX(calc(-50% + var(--pet-edge-shift, 0px)));
}

.bubble::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  width: 8px;
  height: 8px;
  margin-left: -4px;
  background: inherit;
  border-right: 1px solid var(--dsw-alias-border-l1, light-dark(#0000000a, #ffffff0f));
  border-bottom: 1px solid var(--dsw-alias-border-l1, light-dark(#0000000a, #ffffff0f));
  transform: translateY(-5px) rotate(45deg);
}

/* 被戳时的冲击波环。 */
.shock {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 40%;
  height: 40%;
  margin: -20% 0 0 -20%;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.85);
  opacity: 0;
  pointer-events: none;
  animation: pet-shock 0.5s ease-out 1;
}

.sparkles {
  position: absolute;
  inset: 0;
  display: none;
  pointer-events: none;
}

.sparkle {
  position: absolute;
  color: #ffc94d;
  font-size: 16px;
  line-height: 1;
}

.sweat {
  position: absolute;
  top: 24%;
  right: 9%;
  width: 10%;
  height: 14%;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: #74c0fc;
  box-shadow: inset -1px -2px 2px rgba(24, 100, 170, 0.35);
  display: none;
  pointer-events: none;
}

.zzz {
  position: absolute;
  top: 2%;
  right: 10%;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--dsw-alias-label-secondary, light-dark(#61666b, #cfd3d6));
  display: none;
  pointer-events: none;
}

/* 被戳时冒出的小心心：纯 CSS 糖果心（旋转方块 + 双圆三块拼成），
   不用 ♥ 文本字形——系统字体的字形又扁又糊，和球的糖果质感完全不搭。
   .heart 只负责定位与升腾动画；形状在 .heartShape 上，自己不动画，
   两层 transform 互不打架。 */
.heart {
  position: absolute;
  pointer-events: none;
  animation: pet-heart 1.1s ease-out 1;
}

.heartShape {
  display: block;
  width: 12px;
  height: 12px;
  background: radial-gradient(circle at 32% 30%, #ffb1c3 0%, #ff8fab 58%, #f2739a 100%);
  border-radius: 2px;
  transform: rotate(-45deg);
  filter: drop-shadow(0 1px 2px rgba(214, 51, 108, 0.35));
}

.heartShape::before,
.heartShape::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ff8fab;
}

.heartShape::before {
  top: -6px;
  left: 0;
}

.heartShape::after {
  top: 0;
  left: 6px;
}

/* 哼小曲的音符：保留字形，加重一点并带同族投影，和心心一个气质。 */
.note {
  display: block;
  color: #ff8fab;
  font-size: 14px;
  line-height: 1;
  font-weight: 600;
  text-shadow: 0 1px 2px rgba(214, 51, 108, 0.3);
}

/* 右键小菜单：默认开在宠物上方，顶部空间不够就翻到下方（data-below）。
   弹出带一个 0.16s 的微弹现—— instantly 出现的菜单像系统弹窗，
   弹一下的才像小虹递过来的。 */
.menu {
  position: absolute;
  left: 50%;
  top: 8%;
  transform: translateX(calc(-50% + var(--pet-edge-shift, 0px)));
  transform-origin: 50% 100%;
  z-index: 2;
  width: 210px;
  padding: 8px;
  border-radius: 12px;
  background: var(--dsw-alias-bg-module-platform, light-dark(#f9fafb, #353638));
  border: 1px solid var(--dsw-alias-border-l1, light-dark(#0000000a, #ffffff0f));
  box-shadow: 0 8px 24px light-dark(#0f111526, #00000059);
  pointer-events: auto;
  font-size: 12px;
  color: var(--dsw-alias-label-primary, light-dark(#0f1115, #f9fafb));
  animation: pet-menu-in 0.16s cubic-bezier(0.2, 0.9, 0.3, 1) 1;
}

.menu[data-below='true'] {
  top: auto;
  bottom: 8%;
  transform-origin: 50% 0%;
}

.menuRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 2px;
}

.menuLabel {
  flex: none;
  color: var(--dsw-alias-label-secondary, light-dark(#61666b, #cfd3d6));
}

.menuChips {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.chip {
  all: unset;
  cursor: pointer;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--dsw-alias-border-l3, light-dark(#0000001f, #ffffff29));
  font-size: 11px;
  line-height: 16px;
  color: var(--dsw-alias-label-primary, light-dark(#0f1115, #f9fafb));
}

.chip:hover {
  background: var(--dsw-alias-interactive-bg-hover, light-dark(#2631480f, #ffffff14));
}

.chipActive {
  border-color: var(--dsw-alias-button-info-fill, light-dark(#1971c2, #4c9aff));
  background: color-mix(in srgb, var(--dsw-alias-button-info-fill, #1971c2) 12%, transparent);
}

/* 菜单角色行的小色点：颜色由组件内联下发（data-ball 五色）。 */
.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 5px;
  border-radius: 50% !important;
  vertical-align: -1px;
}

.menuItem {
  all: unset;
  display: block;
  width: 100%;
  box-sizing: border-box;
  cursor: pointer;
  margin-top: 4px;
  padding: 6px 8px;
  border-radius: 8px;
  font-size: 12px;
  text-align: left;
  color: var(--dsw-alias-label-primary, light-dark(#0f1115, #f9fafb));
}

.menuItem:hover {
  background: var(--dsw-alias-interactive-bg-hover, light-dark(#2631480f, #ffffff14));
}

/* ——— 状态：共享效果（光环、汗滴、星火、Zzz、腮红、舌头）———
   这些是「状态信号」，与角色无关；脸与动作则由下面的角色段落各自表达。 */
.pet[data-state='resting'] .aura {
  --pet-aura: rgba(217, 73, 61, 0.18);
}

.pet[data-state='working'] .aura {
  --pet-aura: rgba(63, 151, 208, 0.26);
}

/* 等你：光环转琥珀，脉冲快一点——那是「轮到你」的信号。 */
.pet[data-state='waiting'] .aura {
  --pet-aura: rgba(245, 158, 11, 0.32);
  animation-duration: 1.6s;
}

/* 庆祝：星火 + 腮红 + 舌头。 */
.pet[data-state='celebrating'] .aura {
  --pet-aura: rgba(255, 193, 7, 0.42);
  animation-duration: 1.1s;
}

.pet[data-state='celebrating'] .sparkles {
  display: block;
}

.pet[data-state='celebrating'] .blush {
  opacity: 0.95;
  transform: scale(1.15);
}

.pet[data-state='celebrating'] .tongue {
  display: block;
}

/* 出错：汗滴 + 腮红收掉。 */
.pet[data-state='error'] .aura {
  --pet-aura: rgba(240, 90, 60, 0.3);
}

.pet[data-state='error'] .sweat {
  display: block;
  animation: pet-sweat 1.6s ease-in-out infinite;
}

.pet[data-state='error'] .blush {
  opacity: 0.35;
}

/* 打盹：Zzz 上浮。 */
.pet[data-state='sleeping'] .aura {
  --pet-aura: rgba(99, 102, 241, 0.2);
  animation-duration: 6s;
}

.pet[data-state='sleeping'] .zzz {
  display: block;
  animation: pet-zzz 3.2s ease-in-out infinite;
}

/* ————————————————————————————————————————————————
   五个角色：五套独立主题。

   参考图里这五只球的脸**结构就不同**（大竖眼 / 半垂眼皮 / 圆绿眼 /
   小斗鸡眼 / 黄框眼镜），嘴也各是一副形状（双波浪 / 张开白嘴 /
   横杠带勾 / 斜锯齿 / v 形）。所以这里没有「通用脸」——每个角色自带一套
   基准脸（--eye-* / --iris-* / --mouth-* 变量）、一套状态演绎、一套动作脾气。

   几何只在基准态设定（布局属性，不参与过渡）；状态之间一律用 scale /
   translate 换形，绝不触发重排。
   ———————————————————————————————————————————————— */

/* 蓝球的黄框眼镜：框画在眼睛的描边上——描边不会被 overflow 裁剪，
   而眼镜必须探出眼白之外。鼻梁画在 .face::before 上（两只镜片之间那一条）。 */
.pet[data-ball='blue'] .eyeLeft,
.pet[data-ball='blue'] .eyeRight {
  border: var(--glasses-width, 3px) solid var(--glasses-color, #eccd3f);
  border-radius: var(--glasses-radius, 26%);
}

.pet[data-ball='blue'] .face::before {
  content: '';
  position: absolute;
  top: 33%;
  left: 50%;
  width: 9%;
  height: 4%;
  margin-left: -4.5%;
  border-radius: 2px;
  background: var(--glasses-color, #eccd3f);
}

/* ——— 粉球：憨、呆萌、眼睛大 ——— */
.pet[data-ball='pink'] {
  /* 大竖椭圆白眼，蓝虹膜几乎填满 */
  --eye-w: 20%;
  --eye-h: 31%;
  --eye-top: 13%;
  --eye-left: 30%;
  --eye-right: 28%;
  --iris-w: 56%;
  --iris-h: 44%;
  --iris-mx: -28%;
  --iris-my: -33%;
  --iris: radial-gradient(circle at 44% 36%, #1aaff4 0%, #029ee8 62%);
  /* 双波浪嘴：本体是第一个下弧，::before 是第二个 */
  --mouth-w: 17%;
  --mouth-h: 8%;
  --mouth-top: 58%;
  --mouth-left: -6%;
  --mouth-bg: transparent;
  --mouth-radius: 0 0 90% 90% / 0 0 100% 100%;
  --mouth-border: 2.4px solid #1b1b1b;
  --mouth-accent: block;
  --mouth-accent-x: 82%;
  --mouth-accent-y: 0;
  --mouth-accent-w: 100%;
  --mouth-accent-h: 100%;
  --mouth-accent-radius: 0 0 90% 90% / 0 0 100% 100%;
  --mouth-accent-bg: transparent;
  --mouth-accent-border: 2.4px solid #1b1b1b;
  --mouth-accent-transform: none;
  --mouth-accent-origin: center;
}

/* 粉·待机：上下弹跳，幅度最大——呆萌 ball 的待机就是在蹦。 */
.pet[data-ball='pink'][data-state='resting'] .body {
  animation: pet-idle-pink 1.45s cubic-bezier(0.34, 1.3, 0.64, 1) infinite;
}

/* 粉·干活：眼睛微收、目光下移——认真在看。 */
.pet[data-ball='pink'][data-state='working'] .eyeLeft,
.pet[data-ball='pink'][data-state='working'] .eyeRight {
  scale: 0.96 0.9;
  translate: 0 4%;
}

.pet[data-ball='pink'][data-state='working'] .pupil {
  scale: 0.92 1;
  translate: 0 16%;
}

.pet[data-ball='pink'][data-state='working'] .mouth {
  scale: 0.86 0.7;
  translate: 0 12%;
}

.pet[data-ball='pink'][data-state='working'] .body {
  animation: pet-active-pink 1.1s ease-in-out infinite;
}

/* 粉·等你：眼睛睁到最大、目光上抬——在等一个回应。 */
.pet[data-ball='pink'][data-state='waiting'] .eyeLeft,
.pet[data-ball='pink'][data-state='waiting'] .eyeRight {
  scale: 1.14 1.12;
  translate: 0 -3%;
}

.pet[data-ball='pink'][data-state='waiting'] .pupil {
  scale: 1.06 1.06;
  translate: 0 -10%;
}

.pet[data-ball='pink'][data-state='waiting'] .mouth {
  scale: 0.72 0.62;
  translate: 0 8%;
}

.pet[data-ball='pink'][data-state='waiting'] .body {
  animation: pet-idle-pink 0.9s ease-in-out infinite;
}

/* 粉·庆祝：眼弯成月牙、嘴咧到最大。 */
.pet[data-ball='pink'][data-state='celebrating'] .eyeLeft,
.pet[data-ball='pink'][data-state='celebrating'] .eyeRight {
  animation: pet-happy 0.7s ease-in-out infinite;
}

.pet[data-ball='pink'][data-state='celebrating'] .pupil {
  display: none;
}

.pet[data-ball='pink'][data-state='celebrating'] .mouth {
  scale: 1.5 1.7;
  translate: 0 -6%;
}

.pet[data-ball='pink'][data-state='celebrating'] .body {
  animation: pet-cheer-pink 0.72s cubic-bezier(0.3, 0.9, 0.4, 1) 4;
}

/* 粉·出错：眼一大一小、嘴歪斜——懵。 */
.pet[data-ball='pink'][data-state='error'] .eyeLeft {
  scale: 1.1 0.94;
  translate: 0 3%;
}

.pet[data-ball='pink'][data-state='error'] .eyeRight {
  scale: 0.92 1.08;
  translate: 0 -2%;
}

.pet[data-ball='pink'][data-state='error'] .pupil {
  scale: 0.78 0.78;
  translate: 0 14%;
}

.pet[data-ball='pink'][data-state='error'] .mouth {
  scale: 0.92 0.92;
  rotate: -8deg;
}

.pet[data-ball='pink'][data-state='error'] .body {
  animation: pet-error-pink 0.52s ease-out 1;
}

/* 粉·打盹：眼闭成弧线、嘴缩成小点。 */
.pet[data-ball='pink'][data-state='sleeping'] .eyeLeft,
.pet[data-ball='pink'][data-state='sleeping'] .eyeRight {
  scale: 1 0.16;
  translate: 0 30%;
}

.pet[data-ball='pink'][data-state='sleeping'] .pupil {
  display: none;
}

.pet[data-ball='pink'][data-state='sleeping'] .mouth {
  scale: 0.62 0.5;
  translate: 0 16%;
}

.pet[data-ball='pink'][data-state='sleeping'] .body {
  animation: pet-sleep-pink 2.6s ease-in-out infinite;
}

/* ——— 黄球：慵懒、装酷、眼皮永远半垂 ——— */
.pet[data-ball='yellow'] {
  --eye-w: 21%;
  --eye-h: 25%;
  --eye-top: 26%;
  --eye-left: 26%;
  --eye-right: 26%;
  --iris-w: 74%;
  --iris-h: 74%;
  --iris-mx: -37%;
  --iris-my: -33%;
  --iris: radial-gradient(circle at 42% 36%, #e8393f 0%, #cf2b32 62%);
  /* 上眼睑：球色的一块，把虹膜上半盖住——参考图里黄球就是这副半垂眼 */
  --lid-h: 22%;
  --lid-color: #f1cc3d;
  /* 张开的白嘴，右下角一小块黑（嘴角） */
  --mouth-w: 30%;
  --mouth-h: 14%;
  --mouth-top: 58%;
  --mouth-left: -11%;
  --mouth-bg: #ffffff;
  --mouth-radius: 90% 90% 24% 24% / 120% 120% 22% 22%;
  --mouth-rot: 0deg;
  --mouth-accent: block;
  --mouth-accent-x: 58%;
  --mouth-accent-y: 62%;
  --mouth-accent-w: 32%;
  --mouth-accent-h: 32%;
  --mouth-accent-radius: 50%;
  --mouth-accent-bg: #1b1b1b;
  --mouth-accent-transform: none;
  --mouth-accent-origin: center;
}

/* 黄·待机：慢悠悠的钟摆——连呼吸都懒得做。 */
.pet[data-ball='yellow'][data-state='resting'] .body {
  animation: pet-idle-yellow 3.2s ease-in-out infinite;
}

/* 黄·干活：眼皮再压低——懒得睁眼干活。 */
.pet[data-ball='yellow'][data-state='working'] .eyeLeft,
.pet[data-ball='yellow'][data-state='working'] .eyeRight {
  scale: 1 0.96;
}

.pet[data-ball='yellow'][data-state='working'] .eyeLeft::after,
.pet[data-ball='yellow'][data-state='working'] .eyeRight::after {
  height: 56%;
}

.pet[data-ball='yellow'][data-state='working'] .mouth {
  scale: 0.92 0.9;
}

.pet[data-ball='yellow'][data-state='working'] .body {
  animation: pet-active-yellow 2.4s ease-in-out infinite;
}

/* 黄·等你：眼皮抬一半、嘴角上挑——「嗯？」 */
.pet[data-ball='yellow'][data-state='waiting'] .eyeLeft,
.pet[data-ball='yellow'][data-state='waiting'] .eyeRight {
  scale: 1.06 1.06;
}

.pet[data-ball='yellow'][data-state='waiting'] .eyeLeft::after,
.pet[data-ball='yellow'][data-state='waiting'] .eyeRight::after {
  height: 26%;
}

.pet[data-ball='yellow'][data-state='waiting'] .mouth {
  scale: 1.06 1.04;
  translate: 0 -6%;
}

.pet[data-ball='yellow'][data-state='waiting'] .body {
  animation: pet-idle-yellow 2.2s ease-in-out infinite;
}

/* 黄·庆祝：眼皮不动、嘴张得更大——懒洋洋地乐。 */
.pet[data-ball='yellow'][data-state='celebrating'] .eyeLeft,
.pet[data-ball='yellow'][data-state='celebrating'] .eyeRight {
  scale: 1 0.94;
}

.pet[data-ball='yellow'][data-state='celebrating'] .pupil {
  scale: 1 0.7;
}

.pet[data-ball='yellow'][data-state='celebrating'] .mouth {
  scale: 1.35 1.5;
}

.pet[data-ball='yellow'][data-state='celebrating'] .body {
  animation: pet-cheer-yellow 1.1s ease-in-out 3;
}

/* 黄·出错：眼皮耷到最低、嘴缩成一小块——「…行吧」。 */
.pet[data-ball='yellow'][data-state='error'] .eyeLeft,
.pet[data-ball='yellow'][data-state='error'] .eyeRight {
  scale: 1 0.9;
}

.pet[data-ball='yellow'][data-state='error'] .eyeLeft::after,
.pet[data-ball='yellow'][data-state='error'] .eyeRight::after {
  height: 72%;
}

.pet[data-ball='yellow'][data-state='error'] .mouth {
  scale: 0.56 0.5;
  translate: 0 6%;
}

.pet[data-ball='yellow'][data-state='error'] .body {
  animation: pet-error-yellow 0.9s ease-out 1;
}

/* 黄·打盹：眼皮全闭、嘴变成一条细缝。 */
.pet[data-ball='yellow'][data-state='sleeping'] .eyeLeft,
.pet[data-ball='yellow'][data-state='sleeping'] .eyeRight {
  scale: 1 0.3;
}

.pet[data-ball='yellow'][data-state='sleeping'] .eyeLeft::after,
.pet[data-ball='yellow'][data-state='sleeping'] .eyeRight::after {
  height: 100%;
}

.pet[data-ball='yellow'][data-state='sleeping'] .pupil {
  display: none;
}

.pet[data-ball='yellow'][data-state='sleeping'] .mouth {
  scale: 1.3 0.3;
  translate: 0 4%;
}

.pet[data-ball='yellow'][data-state='sleeping'] .body {
  animation: pet-sleep-yellow 4.2s ease-in-out infinite;
}

/* ——— 红球：傲娇、冷面、嘴是一条带勾的横杠 ——— */
.pet[data-ball='red'] {
  --eye-w: 18%;
  --eye-h: 22%;
  --eye-top: 25%;
  --eye-left: 28%;
  --eye-right: 28%;
  --iris-w: 46%;
  --iris-h: 46%;
  --iris-mx: -23%;
  --iris-my: -23%;
  --iris: radial-gradient(circle at 42% 36%, #2fbe5a 0%, #12a03f 62%);
  --mouth-w: 21%;
  --mouth-h: 5%;
  --mouth-top: 64%;
  --mouth-left: -9%;
  --mouth-bg: #1b1b1b;
  --mouth-radius: 2px;
  --mouth-rot: 0deg;
  /* 左端那个向上的小勾 */
  --mouth-accent: block;
  --mouth-accent-x: 0%;
  --mouth-accent-y: -150%;
  --mouth-accent-w: 24%;
  --mouth-accent-h: 170%;
  --mouth-accent-radius: 2px;
  --mouth-accent-bg: #1b1b1b;
  --mouth-accent-transform: rotate(-42deg);
  --mouth-accent-origin: right bottom;
}

/* 红·待机：短促点头，像在表态。 */
.pet[data-ball='red'][data-state='resting'] .body {
  animation: pet-idle-red 1.85s ease-in-out infinite;
}

/* 红·干活：眼睛微眯、嘴杠紧——专注。 */
.pet[data-ball='red'][data-state='working'] .eyeLeft,
.pet[data-ball='red'][data-state='working'] .eyeRight {
  scale: 0.94 0.94;
}

.pet[data-ball='red'][data-state='working'] .pupil {
  scale: 1 0.96;
  translate: 0 8%;
}

.pet[data-ball='red'][data-state='working'] .mouth {
  scale: 0.86 0.8;
  translate: 0 6%;
}

.pet[data-ball='red'][data-state='working'] .body {
  animation: pet-active-red 1.35s ease-in-out infinite;
}

/* 红·等你：眼睛睁大、嘴撇向一边——不情愿。 */
.pet[data-ball='red'][data-state='waiting'] .eyeLeft,
.pet[data-ball='red'][data-state='waiting'] .eyeRight {
  scale: 1.16 1.16;
}

.pet[data-ball='red'][data-state='waiting'] .pupil {
  scale: 0.84 0.84;
  translate: 0 -6%;
}

.pet[data-ball='red'][data-state='waiting'] .mouth {
  scale: 0.92 0.9;
  rotate: 7deg;
  translate: 0 -2%;
}

.pet[data-ball='red'][data-state='waiting'] .body {
  animation: pet-idle-red 1.5s ease-in-out infinite;
}

/* 红·庆祝：眼微弯、嘴横杠一挑——得意。 */
.pet[data-ball='red'][data-state='celebrating'] .eyeLeft,
.pet[data-ball='red'][data-state='celebrating'] .eyeRight {
  scale: 0.98 0.76;
}

.pet[data-ball='red'][data-state='celebrating'] .pupil {
  scale: 1 0.7;
}

.pet[data-ball='red'][data-state='celebrating'] .mouth {
  scale: 1.12 1.1;
  rotate: -5deg;
}

.pet[data-ball='red'][data-state='celebrating'] .body {
  animation: pet-cheer-red 0.8s cubic-bezier(0.3, 0.9, 0.4, 1) 4;
}

/* 红·出错：眼睛瞪圆、嘴横杠一沉——不高兴。 */
.pet[data-ball='red'][data-state='error'] .eyeLeft,
.pet[data-ball='red'][data-state='error'] .eyeRight {
  scale: 1.12 1.12;
}

.pet[data-ball='red'][data-state='error'] .pupil {
  scale: 0.9 0.9;
  translate: 0 -8%;
}

.pet[data-ball='red'][data-state='error'] .mouth {
  scale: 1 0.9;
  translate: 0 10%;
}

.pet[data-ball='red'][data-state='error'] .body {
  animation: pet-error-red 0.46s ease-out 1;
}

/* 红·打盹：眼闭成横线、嘴放松。 */
.pet[data-ball='red'][data-state='sleeping'] .eyeLeft,
.pet[data-ball='red'][data-state='sleeping'] .eyeRight {
  scale: 1 0.14;
  translate: 0 24%;
}

.pet[data-ball='red'][data-state='sleeping'] .pupil {
  display: none;
}

.pet[data-ball='red'][data-state='sleeping'] .mouth {
  scale: 0.82 0.7;
  translate: 0 8%;
}

.pet[data-ball='red'][data-state='sleeping'] .body {
  animation: pet-sleep-red 3s ease-in-out infinite;
}

/* ——— 绿球：暴躁、别扭、眼睛小且斗在一起 ——— */
.pet[data-ball='green'] {
  --eye-w: 17%;
  --eye-h: 18%;
  --eye-top: 29%;
  --eye-left: 36%;
  --eye-right: 36%;
  --iris-w: 52%;
  --iris-h: 52%;
  --iris-mx: -26%;
  --iris-my: -26%;
  --iris: radial-gradient(circle at 42% 36%, #ffb63d 0%, #f5a623 62%);
  /* 斜向锯齿嘴：本体是斜杠，::before 是中间那个折角 */
  --mouth-w: 38%;
  --mouth-h: 6%;
  --mouth-top: 62%;
  --mouth-left: -16%;
  --mouth-bg: #1b1b1b;
  --mouth-radius: 2px;
  --mouth-rot: -14deg;
  --mouth-accent: block;
  --mouth-accent-x: 42%;
  --mouth-accent-y: -160%;
  --mouth-accent-w: 26%;
  --mouth-accent-h: 230%;
  --mouth-accent-radius: 2px;
  --mouth-accent-bg: #1b1b1b;
  --mouth-accent-transform: rotate(24deg);
  --mouth-accent-origin: left bottom;
}

/* 绿·待机：不耐烦的轻颤。 */
.pet[data-ball='green'][data-state='resting'] .body {
  animation: pet-idle-green 1.15s linear infinite;
}

/* 绿·干活：眼睛眯成缝、嘴更斜——憋着。 */
.pet[data-ball='green'][data-state='working'] .eyeLeft,
.pet[data-ball='green'][data-state='working'] .eyeRight {
  scale: 1 0.62;
}

.pet[data-ball='green'][data-state='working'] .pupil {
  scale: 0.82 0.82;
  translate: 0 12%;
}

.pet[data-ball='green'][data-state='working'] .mouth {
  scale: 1 0.82;
  translate: 0 8%;
}

.pet[data-ball='green'][data-state='working'] .body {
  animation: pet-active-green 0.95s ease-in-out infinite;
}

/* 绿·等你：两眼的瞳珠往中间挤——怀疑地看着你。 */
.pet[data-ball='green'][data-state='waiting'] .eyeLeft .pupil {
  translate: 26% 0;
}

.pet[data-ball='green'][data-state='waiting'] .eyeRight .pupil {
  translate: -26% 0;
}

.pet[data-ball='green'][data-state='waiting'] .mouth {
  scale: 0.94 0.9;
  rotate: -20deg;
}

.pet[data-ball='green'][data-state='waiting'] .body {
  animation: pet-idle-green 0.8s linear infinite;
}

/* 绿·庆祝：眼挤成缝、嘴的锯齿上翘——暴躁地欢呼。 */
.pet[data-ball='green'][data-state='celebrating'] .eyeLeft,
.pet[data-ball='green'][data-state='celebrating'] .eyeRight {
  scale: 1 0.42;
}

.pet[data-ball='green'][data-state='celebrating'] .pupil {
  scale: 1 0.6;
}

.pet[data-ball='green'][data-state='celebrating'] .mouth {
  scale: 1.12 1.24;
  rotate: -22deg;
}

.pet[data-ball='green'][data-state='celebrating'] .body {
  animation: pet-cheer-green 0.62s cubic-bezier(0.3, 0.9, 0.4, 1) 4;
}

/* 绿·出错：眼瞪圆、锯齿折成锐角——炸毛。 */
.pet[data-ball='green'][data-state='error'] .eyeLeft,
.pet[data-ball='green'][data-state='error'] .eyeRight {
  scale: 1.28 1.28;
}

.pet[data-ball='green'][data-state='error'] .pupil {
  scale: 0.76 0.76;
  translate: 0 -10%;
}

.pet[data-ball='green'][data-state='error'] .mouth {
  scale: 1.06 1.18;
  rotate: -28deg;
}

.pet[data-ball='green'][data-state='error'] .body {
  animation: pet-error-green 0.42s ease-out 1;
}

/* 绿·打盹：眼闭上、锯齿变平缓。 */
.pet[data-ball='green'][data-state='sleeping'] .eyeLeft,
.pet[data-ball='green'][data-state='sleeping'] .eyeRight {
  scale: 1 0.18;
  translate: 0 18%;
}

.pet[data-ball='green'][data-state='sleeping'] .pupil {
  display: none;
}

.pet[data-ball='green'][data-state='sleeping'] .mouth {
  scale: 0.88 0.8;
  rotate: -6deg;
}

.pet[data-ball='green'][data-state='sleeping'] .body {
  animation: pet-sleep-green 2.2s ease-in-out infinite;
}

/* ——— 蓝球：理性、认真、永远戴着黄框眼镜 ——— */
.pet[data-ball='blue'] {
  --eye-w: 32%;
  --eye-h: 27%;
  --eye-top: 21%;
  --eye-left: 16%;
  --eye-right: 16%;
  --eye-radius: 26%;
  --iris-w: 30%;
  --iris-h: 30%;
  --iris-mx: -15%;
  --iris-my: -15%;
  --iris: #16181c;
  /* 眼镜：框画在眼睛的 ::before 上，鼻子中间的梁画在 .face::before 上 */
  --glasses-color: #eccd3f;
  --glasses-width: 5px;
  --glasses-radius: 26%;
  /* v 形嘴：本体是左斜笔，::before 是右斜笔 */
  --mouth-w: 9%;
  --mouth-h: 4%;
  --mouth-top: 58%;
  --mouth-left: -8%;
  --mouth-bg: #16181c;
  --mouth-radius: 2px;
  --mouth-rot: 32deg;
  --mouth-accent: block;
  --mouth-accent-x: 96%;
  --mouth-accent-y: -30%;
  --mouth-accent-w: 100%;
  --mouth-accent-h: 110%;
  --mouth-accent-radius: 2px;
  --mouth-accent-bg: #16181c;
  --mouth-accent-transform: rotate(-58deg);
  --mouth-accent-origin: left center;
}

/* 蓝·待机：匀速呼吸，绝对规律——像一台仪器的指示灯。 */
.pet[data-ball='blue'][data-state='resting'] .body {
  animation: pet-idle-blue 2.6s linear infinite;
}

/* 蓝·干活：目光正视、嘴拉成一条直线——判定中。 */
.pet[data-ball='blue'][data-state='working'] .pupil {
  scale: 0.86 0.86;
  translate: 0 6%;
}

.pet[data-ball='blue'][data-state='working'] .mouth {
  scale: 1.1 0.7;
  rotate: 0deg;
}

.pet[data-ball='blue'][data-state='working'] .body {
  animation: pet-active-blue 2s linear infinite;
}

/* 蓝·等你：眼镜抬一点、v 嘴变直——等判定结果。 */
.pet[data-ball='blue'][data-state='waiting'] .eyeLeft,
.pet[data-ball='blue'][data-state='waiting'] .eyeRight {
  translate: 0 -4%;
}

.pet[data-ball='blue'][data-state='waiting'] .pupil {
  scale: 0.94 0.94;
}

.pet[data-ball='blue'][data-state='waiting'] .mouth {
  scale: 1.2 0.6;
  rotate: 0deg;
}

.pet[data-ball='blue'][data-state='waiting'] .body {
  animation: pet-idle-blue 1.9s linear infinite;
}

/* 蓝·庆祝：眼镜不晃、v 嘴上翘——克制地点一下头。 */
.pet[data-ball='blue'][data-state='celebrating'] .pupil {
  scale: 0.8 0.8;
}

.pet[data-ball='blue'][data-state='celebrating'] .mouth {
  scale: 1.15 1.2;
  rotate: -18deg;
}

.pet[data-ball='blue'][data-state='celebrating'] .body {
  animation: pet-cheer-blue 0.9s ease-out 3;
}

/* 蓝·出错：眼镜歪一点、v 嘴翻成人字——无语。 */
.pet[data-ball='blue'][data-state='error'] .eyeLeft,
.pet[data-ball='blue'][data-state='error'] .eyeRight {
  rotate: 4deg;
}

.pet[data-ball='blue'][data-state='error'] .pupil {
  scale: 0.82 0.82;
}

.pet[data-ball='blue'][data-state='error'] .mouth {
  scale: 1.1 1;
  rotate: 178deg;
}

.pet[data-ball='blue'][data-state='error'] .body {
  animation: pet-error-blue 0.7s ease-out 1;
}

/* 蓝·打盹：眼镜后闭眼、v 嘴放松。 */
.pet[data-ball='blue'][data-state='sleeping'] .eyeLeft,
.pet[data-ball='blue'][data-state='sleeping'] .eyeRight {
  scale: 1 0.24;
}

.pet[data-ball='blue'][data-state='sleeping'] .pupil {
  display: none;
}

.pet[data-ball='blue'][data-state='sleeping'] .mouth {
  scale: 0.82 0.8;
  rotate: 8deg;
}

.pet[data-ball='blue'][data-state='sleeping'] .body {
  animation: pet-sleep-blue 3.6s ease-in-out infinite;
}

/* 拖拽中：悬空、微垂，动画暂停避免打架。 */
.pet[data-dragging='true'] .body {
  animation-play-state: paused;
}

.pet[data-dragging='true'] .shadow {
  transform: scale(0.72);
  opacity: 0.6;
}

/* 拎起来时眼睛瞪大：拖拽中是连续动作，这一态不参与形变过渡，
   直接改布局盒（一次重排，不影响其他状态）。 */
.pet[data-dragging='true'] .eyeLeft,
.pet[data-dragging='true'] .eyeRight {
  height: 26%;
  scale: 1 1;
  translate: none;
}

/* 被拎起来的「o」嘴：拖拽中是连续动作，这一态直接改布局盒，
   不参与形变过渡（scale/translate 复位，免得叠上别的状态的缩放）。 */
.pet[data-dragging='true'] .mouth {
  width: 8%;
  height: 12%;
  margin-left: -4%;
  border-radius: 50%;
  border: 2.5px solid light-dark(#1b1f24, #0b0d10);
  background: transparent;
  transform: rotate(0deg);
  scale: 1 1;
  translate: none;
}

/* 被拎起来的「o」嘴不带任何角色的嘴部附件。 */
.pet[data-dragging='true'] .mouth::before {
  display: none;
}

/* ——— 一次性反应（连戳转圈 / 晕 / 摸摸 / 踉跄 / 伸懒腰）———
   全部挂在根的 data-* 上，到点由 JS 摘除；动画都是单次播放。 */

/* 连戳转圈：绕几何中心整圈（.motion 平时的转轴在底部，转圈必须换轴心）。 */
.pet[data-spin='true'] .motion {
  transform-origin: 50% 50%;
  animation: pet-spin 0.8s cubic-bezier(0.45, 0.05, 0.35, 1) 1;
}

/* 转完的晕：身体小幅画圈晃，眼睛换 ×。 */
.pet[data-dizzy='true'] .body {
  animation: pet-dizzy 1.25s ease-in-out 1;
}

.pet[data-dizzy='true'] .pupil,
.pet[data-dizzy='true'] .glint,
.pet[data-dizzy='true'] .glintDot {
  display: none;
}

/* 晕的时候 ×_× 是眼神本体：冻结眨眼，别把 X 压扁。 */
.pet[data-dizzy='true'] .eyeLeft,
.pet[data-dizzy='true'] .eyeRight {
  animation: none;
}

.dizzyX {
  position: absolute;
  inset: 14%;
  display: none;
  pointer-events: none;
}

.pet[data-dizzy='true'] .dizzyX {
  display: block;
}

.dizzyX::before,
.dizzyX::after {
  content: '';
  position: absolute;
  left: 6%;
  right: 6%;
  top: 50%;
  height: 14%;
  margin-top: -7%;
  border-radius: 2px;
  background: light-dark(#1b1f24, #0b0d10);
}

.dizzyX::before {
  transform: rotate(45deg);
}

.dizzyX::after {
  transform: rotate(-45deg);
}

/* 摸摸：每个角色眯眼的方式不同——粉球眯得最狠（被摸到最爽），
   黄球几乎不眯（它懒得配合），绿球挤成一条缝，红球只是微微一弯，
   蓝球规规矩矩地眯一下。 */
.pet[data-pat='true'] .body {
  animation: pet-pat 0.9s ease-out 1;
}

.pet[data-pat='true'] .eyeLeft,
.pet[data-pat='true'] .eyeRight {
  animation: pet-happy 0.5s ease-in-out infinite;
}

.pet[data-pat='true'] .pupil,
.pet[data-pat='true'] .glint,
.pet[data-pat='true'] .glintDot {
  display: none;
}

.pet[data-pat='true'] .blush {
  opacity: 1;
  transform: scale(1.25);
}

.pet[data-pat='true'] .mouth {
  width: 14%;
  height: 6%;
  margin-left: -7%;
}

/* 粉球：眯得最开、带回弹——被摸到最开心。 */
.pet[data-ball='pink'][data-pat='true'] .eyeLeft,
.pet[data-ball='pink'][data-pat='true'] .eyeRight {
  animation: pet-happy-pink 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) infinite;
}

/* 黄球：几乎不眯——它懒得配合。 */
.pet[data-ball='yellow'][data-pat='true'] .eyeLeft,
.pet[data-ball='yellow'][data-pat='true'] .eyeRight {
  animation: pet-happy-yellow 0.6s ease-in-out infinite;
}

/* 红球：只是微微弯一下。 */
.pet[data-ball='red'][data-pat='true'] .eyeLeft,
.pet[data-ball='red'][data-pat='true'] .eyeRight {
  animation: pet-happy-red 0.55s ease-in-out infinite;
}

/* 绿球：挤成一条缝。 */
.pet[data-ball='green'][data-pat='true'] .eyeLeft,
.pet[data-ball='green'][data-pat='true'] .eyeRight {
  animation: pet-happy-green 0.45s ease-in-out infinite;
}

/* 蓝球：规规矩矩地眯一下。 */
.pet[data-ball='blue'][data-pat='true'] .eyeLeft,
.pet[data-ball='blue'][data-pat='true'] .eyeRight {
  animation: pet-happy-blue 0.5s ease-in-out infinite;
}

/* 踉跄：窗口大小变了，地板在晃——重心左右找平衡。 */
.pet[data-stumble='true'] .body {
  animation: pet-stumble 0.72s ease-out 1;
}

/* 睡醒伸懒腰：纵向拉长再回弹，像把一夜的觉都舒展开。 */
.pet[data-stretch='true'] .body {
  animation: pet-stretch 0.95s ease-out 1;
}

/* 影子联动补全：身体离地影子就收、落地影子就摊——重量感全靠它。
   惊醒是「蹿起收影再落」；落地从半空就位；空降入场影子从一小点长出。 */
.pet[data-startle='true'] .shadow {
  animation: pet-shadow-dip 0.62s ease-out 1;
}

.pet[data-land='true'] .shadow {
  animation: pet-shadow-land 0.46s cubic-bezier(0.3, 0.8, 0.4, 1) 1;
}

.pet[data-stretch='true'] .shadow {
  animation: pet-shadow-stretch 0.95s ease-out 1;
}

.pet[data-entrance='drop'] .shadow {
  animation: pet-shadow-enter 0.76s cubic-bezier(0.3, 0.9, 0.4, 1) 1;
}

/* 惊醒：打盹中被戳——猛地弹起、落地一抖（起床气）。 */
.pet[data-startle='true'] .body {
  animation: pet-startle 0.62s ease-out 1;
}

/* 落地：拖拽松手后的一记小弹跳——被「放下来」，不是被「传送」。 */
.pet[data-land='true'] .body {
  animation: pet-land 0.46s cubic-bezier(0.3, 0.8, 0.4, 1) 1;
}

/* 哼小曲：闲得自在，抱着手轻轻摇。 */
.pet[data-hum='true'] .body {
  animation: pet-hum 1.8s ease-in-out 1;
}

/* ——— 入场动画（登场时 JS 随机挑一个，播完即摘）———
   每次出现方式都不同：弹现 / 空降 / 旋转 / 蹦入——重逢才有惊喜。
   都挂在 .motion 上（整只一起动），影子留在原地等它落地。 */
.pet[data-entrance='pop'] .motion {
  animation: pet-enter-pop 0.62s cubic-bezier(0.2, 1.4, 0.4, 1) 1;
}

.pet[data-entrance='drop'] .motion {
  animation: pet-enter-drop 0.76s cubic-bezier(0.3, 0.9, 0.4, 1) 1;
}

.pet[data-entrance='spin'] .motion {
  transform-origin: 50% 50%;
  animation: pet-enter-spin 0.78s cubic-bezier(0.3, 0.8, 0.3, 1) 1;
}

.pet[data-entrance='hop'] .motion {
  animation: pet-enter-hop 0.7s ease-out 1;
}

/* ——— 动画强度（设置面板三档）———
   off：用户主动关动画，与系统级「减弱动态效果」等效——表情仍可读，
   只是不再动；subtle：保留全部反应但幅度收敛，把「弹跳」换成「浮动」。 */
.pet[data-motion='off'] .body,
.pet[data-motion='off'] .aura,
.pet[data-motion='off'] .motion,
.pet[data-motion='off'] .eyeLeft,
.pet[data-motion='off'] .eyeRight,
.pet[data-motion='off'] .shadow,
.pet[data-motion='off'] .sheen,
.pet[data-motion='off'] .sparkle,
.pet[data-motion='off'] .sweat,
.pet[data-motion='off'] .zzz,
.pet[data-motion='off'] .shock,
.pet[data-motion='off'] .heart {
  animation: none !important;
}

.pet[data-motion='off'] .menu {
  animation: none !important;
}

/* 「关」档要真的什么都不动：几何过渡（眼睛/嘴/腮红/气泡/影子）也得停，
   否则用户选的是「不动画」，拿到的却是「动得更慢」。 */
.pet[data-motion='off'] .pupil,
.pet[data-motion='off'] .glint,
.pet[data-motion='off'] .glintDot,
.pet[data-motion='off'] .hit,
.pet[data-motion='off'] .eyeLeft,
.pet[data-motion='off'] .eyeRight,
.pet[data-motion='off'] .mouth,
.pet[data-motion='off'] .blush,
.pet[data-motion='off'] .bubble,
.pet[data-motion='off'] .shadow {
  transition: none !important;
}

/* 轻柔档：原来只收了几处动画幅度，其余（待机呼吸、打盹、光环、高光、眨眼）
   仍是全量——用户选「轻柔」拿到的还是满幅度。现在统一收一档。 */
.pet[data-motion='subtle'] {
  --pet-aura-scale: 1.02;
  --pet-sheen-shift: -0.4%;
  --pet-blink-period: 9.4s;
}

.pet[data-motion='subtle'][data-state='resting'] .body {
  animation: pet-rest-calm 6.4s ease-in-out infinite;
}

.pet[data-motion='subtle'][data-state='sleeping'] .body {
  animation: pet-sleep-calm 6.2s ease-in-out infinite;
}

.pet[data-motion='subtle'][data-state='working'] .body {
  animation: pet-work-calm 2.2s ease-in-out infinite;
}

.pet[data-motion='subtle'][data-state='waiting'] .body {
  animation: pet-wait-calm 1.8s ease-in-out infinite;
}

.pet[data-motion='subtle'][data-state='celebrating'] .body {
  animation: pet-cheer-calm 1.3s ease-in-out 3;
}

.pet[data-motion='subtle'][data-state='celebrating'] .shadow {
  animation: none;
}

.pet[data-motion='subtle'][data-stumble='true'] .body {
  animation: pet-stumble-calm 0.8s ease-out 1;
}

/* ——— 关键帧 ——— */

/* ——— 五个角色各自的动作关键帧 ———
   五套完全不同的动作语言：粉是弹跳、黄是钟摆、红是点头、绿是轻颤、蓝是匀速呼吸。
   不是同一套关键帧换参数——每一套的运动轨迹本身就不同。 */

/* 粉球：弹跳（幅度大、带回弹） */
@keyframes pet-idle-pink {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  45% { transform: translateY(-4px) scale(1.03, 0.97); }
}

@keyframes pet-active-pink {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-2px) rotate(1.2deg); }
}

@keyframes pet-cheer-pink {
  0% { transform: translateY(0) scale(1, 1); }
  20% { transform: translateY(3px) scale(1.07, 0.93); }
  50% { transform: translateY(-14px) scale(0.95, 1.06); }
  78% { transform: translateY(0) scale(1.04, 0.96); }
  100% { transform: translateY(0) scale(1, 1); }
}

@keyframes pet-error-pink {
  0%, 100% { transform: rotate(0deg); }
  30% { transform: rotate(-5deg) translateY(-1px); }
  65% { transform: rotate(4deg); }
}

@keyframes pet-sleep-pink {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  50% { transform: translateY(1.5px) scale(1.02, 0.98); }
}

/* 黄球：钟摆（慢、幅度大、几乎不呼吸） */
@keyframes pet-idle-yellow {
  0%, 100% { transform: rotate(-2.6deg) translateY(1px); }
  50% { transform: rotate(2.6deg) translateY(-1px); }
}

@keyframes pet-active-yellow {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50% { transform: translateY(-1px) rotate(1deg); }
}

@keyframes pet-cheer-yellow {
  0%, 100% { transform: rotate(0deg) scale(1, 1); }
  30% { transform: rotate(-4deg) scale(1.02, 0.98); }
  70% { transform: rotate(4deg) scale(0.99, 1.01); }
}

@keyframes pet-error-yellow {
  0%, 100% { transform: translateY(0) scaleY(1); }
  40% { transform: translateY(2.5px) scaleY(0.96); }
}

@keyframes pet-sleep-yellow {
  0%, 100% { transform: translateY(1.5px) scale(1.01, 0.99); }
  50% { transform: translateY(0) scale(1, 1); }
}

/* 红球：点头（短促、干脆） */
@keyframes pet-idle-red {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  30% { transform: translateY(-2px) rotate(-1.2deg); }
  62% { transform: translateY(0) rotate(1.2deg); }
}

@keyframes pet-active-red {
  0%, 100% { transform: translateY(0) rotate(-0.9deg); }
  50% { transform: translateY(-1px) rotate(0.9deg); }
}

@keyframes pet-cheer-red {
  0% { transform: translateY(0) scale(1, 1); }
  25% { transform: translateY(2px) scale(1.05, 0.95); }
  55% { transform: translateY(-8px) scale(0.98, 1.03); }
  80% { transform: translateY(0) scale(1, 1); }
  100% { transform: translateY(0) scale(1, 1); }
}

@keyframes pet-error-red {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  25% { transform: translateX(-3px) rotate(-2deg); }
  55% { transform: translateX(3px) rotate(2deg); }
  80% { transform: translateX(-1px) rotate(-1deg); }
}

@keyframes pet-sleep-red {
  0%, 100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(1px) scaleY(1.012); }
}

/* 绿球：轻颤（快、不规则、带躁动） */
@keyframes pet-idle-green {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  20% { transform: translate(0.6px, -0.4px) rotate(0.7deg); }
  45% { transform: translate(-0.5px, 0.3px) rotate(-0.6deg); }
  70% { transform: translate(0.4px, 0.5px) rotate(0.4deg); }
}

@keyframes pet-active-green {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-1.5px) rotate(0.9deg); }
}

@keyframes pet-cheer-green {
  0% { transform: translateY(0) scale(1, 1); }
  20% { transform: translateY(4px) scale(1.09, 0.91); }
  50% { transform: translateY(-11px) scale(0.94, 1.07) rotate(2.5deg); }
  80% { transform: translateY(0) scale(1.03, 0.97); }
  100% { transform: translateY(0) scale(1, 1); }
}

@keyframes pet-error-green {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  15% { transform: translate(-2px, 0) rotate(-3deg); }
  35% { transform: translate(2px, -1px) rotate(3deg); }
  55% { transform: translate(-2px, 1px) rotate(-2deg); }
  78% { transform: translate(1px, 0) rotate(1deg); }
}

@keyframes pet-sleep-green {
  0%, 100% { transform: translateY(1px) rotate(-1deg); }
  50% { transform: translateY(0) rotate(1deg); }
}

/* 蓝球：匀速呼吸（绝对规律，像仪器） */
@keyframes pet-idle-blue {
  0%, 100% { transform: scale(1, 1); }
  50% { transform: scale(1.015, 0.985); }
}

@keyframes pet-active-blue {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-0.6px); }
}

@keyframes pet-cheer-blue {
  0% { transform: translateY(0); }
  30% { transform: translateY(-3px); }
  72% { transform: translateY(0); }
  100% { transform: translateY(0); }
}

@keyframes pet-error-blue {
  0%, 100% { transform: rotate(0deg); }
  45% { transform: rotate(3deg) translateX(1px); }
}

@keyframes pet-sleep-blue {
  0%, 100% { transform: scale(1, 1); }
  50% { transform: scale(1.02, 0.98); }
}

@keyframes pet-rest {
  0%, 100% { transform: translateY(0) rotate(0deg) scaleY(1); }
  30% { transform: translateY(-2px) rotate(-1deg) scaleY(1.02); }
  65% { transform: translateY(0) rotate(1deg) scaleY(0.995); }
}

@keyframes pet-work {
  0%, 100% { transform: translateY(0) rotate(-1.6deg) scale(1, 1); }
  50% { transform: translateY(-4px) rotate(1.6deg) scale(1.012, 0.99); }
}

@keyframes pet-wait {
  0%, 100% { transform: translateY(0) rotate(-2.2deg); }
  50% { transform: translateY(-6px) rotate(2.2deg); }
}

@keyframes pet-cheer {
  0% { transform: translateY(0) scale(1, 1); }
  14% { transform: translateY(3px) scale(1.09, 0.9); }
  44% { transform: translateY(-20px) scale(0.94, 1.07); }
  70% { transform: translateY(0) scale(1.06, 0.93); }
  86% { transform: translateY(-4px) scale(0.99, 1.02); }
  100% { transform: translateY(0) scale(1, 1); }
}

@keyframes pet-shake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  20% { transform: translateX(-5px) rotate(-3deg); }
  40% { transform: translateX(5px) rotate(3deg); }
  60% { transform: translateX(-3px) rotate(-2deg); }
  80% { transform: translateX(2px) rotate(1deg); }
}

@keyframes pet-sleep {
  0%, 100% { transform: translateY(0) rotate(-4deg) scale(1, 1); }
  50% { transform: translateY(2.5px) rotate(-4deg) scale(1.02, 1.045); }
}

/* 眨眼：7.4 秒一轮，三次眨（其中一次是连眨），不规律才像活的。 */
@keyframes pet-blink {
  0%, 34% { transform: scaleY(1); }
  36%, 37.4% { transform: scaleY(0.08); }
  38%, 39% { transform: scaleY(1); }
  42%, 43.4% { transform: scaleY(0.08); }
  44%, 100% { transform: scaleY(1); }
}

/* 庆祝时眯眼笑。 */
@keyframes pet-happy {
  0%, 100% { transform: scaleY(0.42); }
  50% { transform: scaleY(0.26); }
}

/* 各角色被摸时的眯眼：幅度与节奏各不相同。 */
@keyframes pet-happy-pink {
  0%, 100% { transform: scaleY(0.28); }
  50% { transform: scaleY(0.1); }
}

@keyframes pet-happy-yellow {
  0%, 100% { transform: scaleY(0.78); }
  50% { transform: scaleY(0.7); }
}

@keyframes pet-happy-red {
  0%, 100% { transform: scaleY(0.58); }
  50% { transform: scaleY(0.44); }
}

@keyframes pet-happy-green {
  0%, 100% { transform: scaleY(0.2); }
  50% { transform: scaleY(0.08); }
}

@keyframes pet-happy-blue {
  0%, 100% { transform: scaleY(0.5); }
  50% { transform: scaleY(0.38); }
}

@keyframes pet-aura {
  0%, 100% { opacity: 0.75; transform: scale(1); }
  50% { opacity: 1; transform: scale(var(--pet-aura-scale, 1.06)); }
}

@keyframes pet-sparkle {
  0%, 100% { opacity: 0.25; transform: scale(0.7); }
  50% { opacity: 1; transform: scale(1.15); }
}

@keyframes pet-sweat {
  0%, 100% { opacity: 0.35; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(4px); }
}

@keyframes pet-zzz {
  0% { opacity: 0; transform: translateY(6px) scale(0.8); }
  40% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-14px) scale(1.1); }
}

@keyframes pet-shock {
  0% { opacity: 0.9; transform: scale(0.6); }
  100% { opacity: 0; transform: scale(2.6); }
}

/* 庆祝跳跃的影子联动：与 pet-cheer 同周期，44% 处身体到最高点
   （translateY(-20px)），影子同步收到最小最淡。 */
@keyframes pet-shadow-jump {
  0%, 100% { transform: scale(1); opacity: 1; }
  14% { transform: scale(1.08); opacity: 1; }
  44% { transform: scale(0.55); opacity: 0.4; }
  70% { transform: scale(1.05); opacity: 0.9; }
}

/* 打盹呼吸的影子联动：身体变宽时影子也微放大。 */
@keyframes pet-shadow-sleep {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.06); opacity: 1; }
}

/* 惊醒的影子联动：身体蹿到最高点时收到最小最淡，落地摊开再归位。 */
@keyframes pet-shadow-dip {
  0% { transform: scale(1); opacity: 1; }
  20% { transform: scale(0.55); opacity: 0.45; }
  45% { transform: scale(1.14); opacity: 1; }
  72% { transform: scale(0.96); opacity: 0.92; }
  100% { transform: scale(1); opacity: 1; }
}

/* 落地的影子联动：从半空就位（略小略淡），压扁着地时摊到最宽。 */
@keyframes pet-shadow-land {
  0% { transform: scale(0.8); opacity: 0.7; }
  38% { transform: scale(1.14); opacity: 1; }
  70% { transform: scale(0.97); opacity: 0.92; }
  100% { transform: scale(1); opacity: 1; }
}

/* 伸懒腰的影子联动：身体拉高变窄时影子微收。 */
@keyframes pet-shadow-stretch {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  38% { transform: scale(0.93); opacity: 0.8; }
}

/* 空降入场的影子联动：球还在半空，影子先从一小点长成全影。 */
@keyframes pet-shadow-enter {
  0% { transform: scale(0.5); opacity: 0.35; }
  62% { transform: scale(1.15); opacity: 1; }
  80% { transform: scale(0.96); opacity: 0.9; }
  100% { transform: scale(1); opacity: 1; }
}

/* 高光呼吸：与待机呼吸同周期，球面反光跟着轻轻漂——「活」不只身子在动。 */
@keyframes pet-sheen {
  0%, 100% { transform: translate(0, 0); }
  30% { transform: translate(var(--pet-sheen-shift, -1%), calc(var(--pet-sheen-shift, -1%) * 0.8)); }
  65% { transform: translate(calc(var(--pet-sheen-shift, -1%) * -0.8), calc(var(--pet-sheen-shift, -1%) * 0.6)); }
}

/* 菜单弹现：从宠物那一侧（transform-origin 按 data-below 翻转）长出来。 */
@keyframes pet-menu-in {
  0% { opacity: 0; transform: translateX(calc(-50% + var(--pet-edge-shift, 0px))) scale(0.94); }
  100% { opacity: 1; transform: translateX(calc(-50% + var(--pet-edge-shift, 0px))); }
}

/* 连戳转圈：起转稍缓、甩过头顶稍快，结尾回正——不是匀速风车。 */
@keyframes pet-spin {
  0% { transform: rotate(0deg) scale(1, 1); }
  40% { transform: rotate(190deg) scale(1.04, 0.97); }
  88% { transform: rotate(374deg) scale(0.99, 1.02); }
  100% { transform: rotate(360deg) scale(1, 1); }
}

/* 晕：左右缓晃，幅度递减——像天旋地转在慢慢停。 */
@keyframes pet-dizzy {
  0% { transform: rotate(-7deg) translateX(-2px); }
  22% { transform: rotate(5deg) translateX(2px); }
  48% { transform: rotate(-4deg) translateX(-1px); }
  74% { transform: rotate(2.5deg) translateX(1px); }
  100% { transform: rotate(0deg) translateX(0); }
}

/* 摸摸：先鼓起（被按出坑再弹回来），再果冻似的晃两下。 */
@keyframes pet-pat {
  0% { transform: scale(1, 1); }
  28% { transform: scale(1.16, 0.86); }
  52% { transform: scale(0.93, 1.11); }
  74% { transform: scale(1.05, 0.97); }
  100% { transform: scale(1, 1); }
}

/* 踉跄：重心左右找平衡，每一下都比上一下小。 */
@keyframes pet-stumble {
  0% { transform: rotate(0deg) translateX(0); }
  16% { transform: rotate(-12deg) translateX(-3px) scale(1.03, 0.97); }
  38% { transform: rotate(9deg) translateX(2px); }
  58% { transform: rotate(-6deg) translateX(-1.5px); }
  78% { transform: rotate(3deg) translateX(1px); }
  100% { transform: rotate(0deg) translateX(0); }
}

@keyframes pet-stumble-calm {
  0%, 100% { transform: rotate(0deg) translateX(0); }
  25% { transform: rotate(-5deg) translateX(-1.5px); }
  55% { transform: rotate(4deg) translateX(1px); }
  80% { transform: rotate(-2deg); }
}

/* 伸懒腰：纵向拉长、踮起脚尖，再泄气回弹。 */
@keyframes pet-stretch {
  0% { transform: scale(1, 1) translateY(0); }
  38% { transform: scale(0.92, 1.18) translateY(-4px); }
  66% { transform: scale(1.05, 0.96) translateY(1px); }
  84% { transform: scale(0.99, 1.02); }
  100% { transform: scale(1, 1) translateY(0); }
}

/* 惊醒：猛地弹到最高点缩成一条，落地压扁再抖两下。 */
@keyframes pet-startle {
  0% { transform: translateY(0) scale(1, 1); }
  18% { transform: translateY(-16px) scale(0.9, 1.12); }
  42% { transform: translateY(0) scale(1.12, 0.88); }
  62% { transform: translateY(-4px) scale(0.98, 1.03); }
  82% { transform: translateY(0) scale(1.04, 0.97); }
  100% { transform: translateY(0) scale(1, 1); }
}

/* 落地：先压缩蓄力感（从半空落下），压扁、回弹、归位。 */
@keyframes pet-land {
  0% { transform: translateY(-4px) scale(0.96, 1.05); }
  38% { transform: translateY(0) scale(1.1, 0.9); }
  70% { transform: translateY(-2px) scale(0.98, 1.02); }
  100% { transform: translateY(0) scale(1, 1); }
}

/* 哼小曲：小幅、慢速的左右摇——自得其乐的节奏。 */
@keyframes pet-hum {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  30% { transform: translateY(-2px) rotate(-4deg); }
  65% { transform: translateY(0) rotate(4deg); }
}

/* 入场·弹现：从零弹出，过头一回再归位。 */
@keyframes pet-enter-pop {
  0% { transform: scale(0); opacity: 0; }
  55% { transform: scale(1.14); opacity: 1; }
  78% { transform: scale(0.95); }
  100% { transform: scale(1); }
}

/* 入场·空降：从上方落下，落地压扁、小弹一下。 */
@keyframes pet-enter-drop {
  0% { transform: translateY(-44px); }
  62% { transform: translateY(0) scale(1.12, 0.88); }
  80% { transform: translateY(-6px) scale(0.97, 1.04); }
  100% { transform: translateY(0) scale(1); }
}

/* 入场·旋转：倒着缩着转进来，甩过头再回正。 */
@keyframes pet-enter-spin {
  0% { transform: rotate(-200deg) scale(0.3); opacity: 0; }
  45% { opacity: 1; }
  70% { transform: rotate(12deg) scale(1.05); }
  100% { transform: rotate(0deg) scale(1); }
}

/* 入场·蹦入：从左侧两步蹦进来，最后站稳。 */
@keyframes pet-enter-hop {
  0% { transform: translateX(-38px) scale(0.7); opacity: 0; }
  30% { transform: translateX(-16px) translateY(-8px) scale(1.04, 0.96); opacity: 1; }
  55% { transform: translateX(4px) translateY(0) scale(0.96, 1.05); }
  78% { transform: translateX(0) translateY(-3px) scale(1.02, 0.98); }
  100% { transform: translateX(0) scale(1); }
}

/* 轻柔档的待机/打盹：幅度更小、节奏更慢。 */
@keyframes pet-rest-calm {
  0%, 100% { transform: translateY(0) rotate(0deg) scaleY(1); }
  30% { transform: translateY(-1px) rotate(-0.5deg) scaleY(1.01); }
  65% { transform: translateY(0) rotate(0.5deg) scaleY(0.998); }
}

@keyframes pet-sleep-calm {
  0%, 100% { transform: translateY(0) rotate(-2deg) scale(1, 1); }
  50% { transform: translateY(1.2px) rotate(-2deg) scale(1.01, 1.02); }
}

/* 轻柔档的状态动画：保留节奏，去掉弹跳与位移幅度。 */
@keyframes pet-work-calm {
  0%, 100% { transform: translateY(0) rotate(-0.9deg); }
  50% { transform: translateY(-2px) rotate(0.9deg); }
}

@keyframes pet-wait-calm {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  50% { transform: translateY(-2.5px) scale(1.012, 0.99); }
}

@keyframes pet-cheer-calm {
  0%, 100% { transform: translateY(0); }
  45% { transform: translateY(-6px) scale(0.985, 1.025); }
  70% { transform: translateY(0) scale(1.015, 0.99); }
}

@keyframes pet-heart {
  0% { opacity: 0; transform: translateY(2px) scale(0.3) rotate(-14deg); }
  25% { opacity: 1; transform: translateY(-12px) scale(1.08) rotate(6deg); }
  100% { opacity: 0; transform: translateY(-46px) scale(0.8) rotate(-8deg); }
}

/* 用户开启「减弱动态效果」时停掉全部动画，状态仍然可读。
   系统级设置压过用户档位：即便偏好是「全量」，OS 说减就减。 */
@media (prefers-reduced-motion: reduce) {
  .body,
  .aura,
  .motion,
  .eyeLeft,
  .eyeRight,
  .shadow,
  .sheen,
  .sparkle,
  .sweat,
  .zzz,
  .shock,
  .heart,
  .menu {
    animation: none !important;
  }

  .pupil,
  .glint,
  .glintDot,
  .hit,
  .body,
  .bubble,
  .eyeLeft,
  .eyeRight,
  .mouth,
  .blush,
  .shadow {
    transition: none !important;
  }
}

/* 预览页的排版：把桌宠从「固定在窗口右下角」改成矩阵排布。
   尺寸按 112px 定，六列刚好放得下。 */
body { margin: 0; padding: 24px; background: #f6f7f9; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
h1 { margin: 0 0 18px; font-size: 17px; font-weight: 600; color: #222; }
h2 { margin: 22px 0 10px; font-size: 14px; font-weight: 600; color: #444; }
.grid { display: grid; grid-template-columns: repeat(6, max-content); gap: 12px; }
.cell { margin: 0; padding: 10px; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.cell.big .stage { width: 150px; height: 150px; }
.stage { position: relative; width: 112px; height: 112px; }
.stage .pet { position: absolute; inset: 0; width: 112px !important; height: 112px !important; }
figcaption { margin-top: 6px; font-size: 12px; color: #555; text-align: center; }
code { color: #999; }
</style>
