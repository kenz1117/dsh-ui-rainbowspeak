<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>小虹 · 六种表情预览</title>
<style>
/**
 * 桌宠「小虹」：纯 CSS 几何画的一只彩虹水滴。
 *
 * 分层是有意的，因为三层的「谁拥有 transform」必须分清：
 * - `.motion` —— **JS 拥有**：挤压回弹、拖拽摆动（直接写 style）；
 * - `.body`  —— **CSS 拥有**：状态动画（呼吸 / 忙碌 / 庆祝 / 抖动 / 打盹）；
 * - `.eye`   —— 眨眼；`.pupil` 用 `--pet-look-x/y` 跟随指针。
 *
 * 质感按「玻璃水滴」叠层：身体是彩色玻璃，`.sheen` 负责「光进了玻璃」
 * （大高光 + 小星点 + 底部内阴影），`.rim` 负责轮廓（外圈深色描边让浅色
 * 主题下也勾得住形，内圈亮边勾体积）。头顶 `.tip` 是水滴尖——呆毛式的
 * 小尖端，独立轻摆，是「活着」的信号灯。
 *
 * 配色：角色本色（彩虹）是画作，固定不变；气泡与菜单走宿主 `--dsw-alias-*`
 * 令牌，深浅主题自动跟随。
 */

.pet {
  position: fixed;
  z-index: 40;
  /* 覆盖层本身是点击穿透的：只有角色本体重新接回指针事件。 */
  pointer-events: none;
  width: var(--dsh-pet-size, 104px);
  height: var(--dsh-pet-size, 104px);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  /* 瞳孔跟随指针的位移（JS 直接写这里）。 */
  --pet-look-x: 0px;
  --pet-look-y: 0px;
}

.hit {
  all: unset;
  box-sizing: border-box;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: grab;
  pointer-events: auto;
  touch-action: none;
  border-radius: 50%;
}

.hit:active {
  cursor: grabbing;
}

.hit:focus-visible {
  outline: 2px solid var(--dsw-alias-brand-primary, light-dark(#0f1115, #f9fafb));
  outline-offset: 4px;
}

/* JS 形变层：挤压回弹与拖拽摆动都写在这里。 */
.motion {
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  transform-origin: 50% 90%;
  will-change: transform;
}

/* 状态光环：随状态换色，庆祝时更亮。 */
.aura {
  position: absolute;
  inset: 6%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--pet-aura, rgba(120, 170, 255, 0.22)) 0%, transparent 68%);
  filter: blur(6px);
  opacity: 0.9;
  transition: background 0.3s ease, opacity 0.3s ease;
  pointer-events: none;
  animation: pet-aura 3.6s ease-in-out infinite;
}

.body {
  position: relative;
  display: block;
  width: 78%;
  height: 78%;
  margin: 0 auto 6%;
  border-radius: 50% 50% 45% 45% / 58% 58% 42% 42%;
  background: conic-gradient(from 0deg, #ff6b6b, #ffa94d, #ffd43b, #51cf66, #339af0, #845ef7, #ff6b6b);
  box-shadow: 0 8px 18px light-dark(#0f111526, #00000059);
  transform-origin: 50% 90%;
  will-change: transform;
}

/* 水滴尖（呆毛）：头顶的小尖端。两个要点：
   一、根部必须压进身体（重叠够深、贴近头顶最高点），否则圆顶弧线
   一转弯尖端就「漂」在空中；二、颜色必须与身体顶部同族——根取身体
   顶部的本色，梢头只是「被照亮的一截」，换成异色就成插在头上的签子。
   waiting / error 身体整体换色时呆毛跟着换（见状态段）。 */
.tip {
  position: absolute;
  top: -7%;
  left: 53%;
  width: 14%;
  height: 24%;
  border-radius: 50% 50% 50% 50% / 70% 70% 32% 32%;
  background: linear-gradient(196deg, #ffd9d9 0%, #ff9c9c 48%, #ff6b6b 100%);
  box-shadow: inset -1px 1px 1px rgba(255, 255, 255, 0.45), 0 0 0 1px light-dark(#0f11151f, #0000002e);
  transform-origin: 50% 96%;
  transform: rotate(26deg);
  pointer-events: none;
  animation: pet-tip 5.6s ease-in-out infinite;
}

/* 玻璃高光：让水滴有体积感。
   五层光——左上大高光（主反射）、大高光里的小星点（第二反射，玻璃的
   「脆」感）、顶部一线天光、右下暗部（光穿不过去的厚度）、底缘一线
   地面反光（桌面把光弹回来）。
   渐变终点一律用同色相的 0 alpha（`transparent` 会经 rgba(0,0,0,0)
   插值出灰边，高光就「贴」上去了）。 */
.sheen {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    radial-gradient(58% 44% at 31% 20%, rgba(255, 255, 255, 0.66), rgba(255, 255, 255, 0) 100%),
    radial-gradient(16% 12% at 23% 11%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0) 100%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0) 16%),
    radial-gradient(84% 58% at 68% 92%, rgba(15, 20, 30, 0.18), rgba(15, 20, 30, 0) 100%),
    radial-gradient(74% 26% at 50% 106%, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0) 100%);
  pointer-events: none;
}

/* 轮廓：外圈深色细描边（浅色主题下把形从亮背景里勾出来），
   内圈亮边（玻璃边缘的全反射）。 */
.rim {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow:
    0 0 0 1px light-dark(#0f111545, #00000066),
    inset 0 0 0 1.5px rgba(255, 255, 255, 0.42);
  pointer-events: none;
}

.face {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* 眼睛：白色眼白（带上部眼窝渐暗）+ 深色瞳孔（径向渐变显通透）
   + 双层高光（左上大 + 右下小，玻璃般「有神」的关键），瞳孔跟着指针挪。 */
.eyeLeft,
.eyeRight {
  position: absolute;
  top: 38%;
  width: 17%;
  height: 21%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 32%, #ffffff 0%, rgba(255, 255, 255, 0.96) 62%, rgba(226, 232, 238, 0.94) 100%);
  box-shadow: inset 0 1.5px 2px rgba(15, 17, 21, 0.14);
  overflow: hidden;
  transform-origin: center;
  animation: pet-blink 7.4s ease-in-out infinite;
}

.eyeLeft {
  left: 25%;
}

.eyeRight {
  right: 25%;
}

.pupil {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 62%;
  height: 62%;
  margin: -31% 0 0 -31%;
  border-radius: 50%;
  background: radial-gradient(circle at 42% 36%, #3d454e 0%, light-dark(#1b1f24, #0b0d10) 62%);
  transform: translate(var(--pet-look-x), var(--pet-look-y));
  /* 曲线先快后慢：指针跟随跟得住，闲逛扫视一跳即停，都像真的眼动。 */
  transition: transform 0.14s cubic-bezier(0.2, 0.9, 0.3, 1);
}

.glint {
  position: absolute;
  left: 20%;
  top: 14%;
  width: 32%;
  height: 32%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.92);
  transform: translate(var(--pet-look-x), var(--pet-look-y));
  transition: transform 0.14s cubic-bezier(0.2, 0.9, 0.3, 1);
}

/* 第二高光：右下小星点，随瞳孔一起挪。 */
.glintDot {
  position: absolute;
  right: 16%;
  bottom: 12%;
  width: 15%;
  height: 15%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  transform: translate(var(--pet-look-x), var(--pet-look-y));
  transition: transform 0.14s cubic-bezier(0.2, 0.9, 0.3, 1);
}

/* 眉毛：情绪的主要载体。 */
.browLeft,
.browRight {
  position: absolute;
  top: 30%;
  width: 15%;
  height: 3%;
  border-radius: 2px;
  background: light-dark(#1b1f24, #0b0d10);
  opacity: 0.72;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.browLeft {
  left: 26%;
  transform: rotate(-8deg);
}

.browRight {
  right: 26%;
  transform: rotate(8deg);
}

/* 腮红：radial 晕染而非实心块——像皮下透出来的红，边缘必须消失于无形。 */
.blush {
  position: absolute;
  top: 54%;
  width: 19%;
  height: 11%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 122, 152, 0.52) 0%, rgba(255, 122, 152, 0) 72%);
  opacity: 0.75;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.blushLeft {
  left: 13%;
}

.blushRight {
  right: 13%;
}

.mouth {
  position: absolute;
  top: 60%;
  left: 50%;
  width: 17%;
  height: 9%;
  margin-left: -8.5%;
  border-bottom: 2.5px solid light-dark(#1b1f24, #0b0d10);
  border-radius: 0 0 60% 60%;
  overflow: hidden;
  transition: transform 0.2s ease, border-radius 0.2s ease, height 0.2s ease, width 0.2s ease;
}

/* 舌头：庆祝大笑时从下缘露出一小片。 */
.tongue {
  position: absolute;
  left: 50%;
  bottom: -2px;
  width: 46%;
  height: 52%;
  margin-left: -23%;
  border-radius: 50% 50% 55% 55%;
  background: #ff8787;
  display: none;
}

/* 影子：径向两层衰减——中心实、边缘散，比平涂一块更贴「软着地」。 */
.shadow {
  position: absolute;
  bottom: 2%;
  left: 50%;
  width: 44%;
  height: 6%;
  margin-left: -22%;
  border-radius: 50%;
  background: radial-gradient(closest-side, light-dark(#0f111533, #00000059) 0%, light-dark(#0f111514, #0000002e) 62%, light-dark(#0f111500, #00000000) 100%);
  filter: blur(2px);
  pointer-events: none;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

/* 说话气泡：状态一句话，悬停 / 被戳 / 状态突变时出现。
   `--pet-edge-shift` 是贴边修正量：宠物靠边时整体往里推，别被裁掉。 */
.bubble {
  position: absolute;
  left: 50%;
  bottom: 94%;
  transform: translateX(calc(-50% + var(--pet-edge-shift, 0px)));
  max-width: 220px;
  padding: 7px 12px;
  border-radius: 14px;
  background: var(--dsw-alias-bg-module-platform, light-dark(#f9fafb, #353638));
  border: 1px solid var(--dsw-alias-border-l1, light-dark(#0000000a, #ffffff0f));
  box-shadow: 0 4px 12px light-dark(#0f111526, #00000059);
  color: var(--dsw-alias-label-primary, light-dark(#0f1115, #f9fafb));
  font-size: 12px;
  line-height: 18px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, translate 0.18s ease;
}

.bubble[data-visible='true'] {
  opacity: 1;
}

.bubble::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  width: 8px;
  height: 8px;
  margin-left: -4px;
  background: inherit;
  border-right: 1px solid var(--dsw-alias-border-l1, light-dark(#0000000a, #ffffff0f));
  border-bottom: 1px solid var(--dsw-alias-border-l1, light-dark(#0000000a, #ffffff0f));
  transform: translateY(-5px) rotate(45deg);
}

/* 被戳时的冲击波环。 */
.shock {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 40%;
  height: 40%;
  margin: -20% 0 0 -20%;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.85);
  opacity: 0;
  pointer-events: none;
  animation: pet-shock 0.5s ease-out 1;
}

.sparkles {
  position: absolute;
  inset: 0;
  display: none;
  pointer-events: none;
}

.sparkle {
  position: absolute;
  color: #ffc94d;
  font-size: 16px;
  line-height: 1;
}

.sweat {
  position: absolute;
  top: 24%;
  right: 9%;
  width: 10%;
  height: 14%;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: #74c0fc;
  box-shadow: inset -1px -2px 2px rgba(24, 100, 170, 0.35);
  display: none;
  pointer-events: none;
}

.zzz {
  position: absolute;
  top: 2%;
  right: 10%;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--dsw-alias-label-secondary, light-dark(#61666b, #cfd3d6));
  display: none;
  pointer-events: none;
}

/* 被戳时冒出的小心心。 */
.heart {
  position: absolute;
  color: #ff8fab;
  font-size: 13px;
  line-height: 1;
  pointer-events: none;
  animation: pet-heart 1.1s ease-out 1;
}

/* 右键小菜单：默认开在宠物上方，顶部空间不够就翻到下方（data-below）。 */
.menu {
  position: absolute;
  left: 50%;
  top: 8%;
  transform: translateX(calc(-50% + var(--pet-edge-shift, 0px)));
  z-index: 2;
  width: 210px;
  padding: 8px;
  border-radius: 12px;
  background: var(--dsw-alias-bg-module-platform, light-dark(#f9fafb, #353638));
  border: 1px solid var(--dsw-alias-border-l1, light-dark(#0000000a, #ffffff0f));
  box-shadow: 0 8px 24px light-dark(#0f111526, #00000059);
  pointer-events: auto;
  font-size: 12px;
  color: var(--dsw-alias-label-primary, light-dark(#0f1115, #f9fafb));
}

.menu[data-below='true'] {
  top: auto;
  bottom: 8%;
}

.menuRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 2px;
}

.menuLabel {
  flex: none;
  color: var(--dsw-alias-label-secondary, light-dark(#61666b, #cfd3d6));
}

.menuChips {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.chip {
  all: unset;
  cursor: pointer;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--dsw-alias-border-l3, light-dark(#0000001f, #ffffff29));
  font-size: 11px;
  line-height: 16px;
  color: var(--dsw-alias-label-primary, light-dark(#0f1115, #f9fafb));
}

.chip:hover {
  background: var(--dsw-alias-interactive-bg-hover, light-dark(#2631480f, #ffffff14));
}

.chipActive {
  border-color: var(--dsw-alias-button-info-fill, light-dark(#1971c2, #4c9aff));
  background: color-mix(in srgb, var(--dsw-alias-button-info-fill, #1971c2) 12%, transparent);
}

.menuItem {
  all: unset;
  display: block;
  width: 100%;
  box-sizing: border-box;
  cursor: pointer;
  margin-top: 4px;
  padding: 6px 8px;
  border-radius: 8px;
  font-size: 12px;
  text-align: left;
  color: var(--dsw-alias-label-primary, light-dark(#0f1115, #f9fafb));
}

.menuItem:hover {
  background: var(--dsw-alias-interactive-bg-hover, light-dark(#2631480f, #ffffff14));
}

/* ——— 状态：表情 + 动效 ——— */

/* 待机：缓慢呼吸 + 轻微摇摆。 */
.pet[data-state='resting'] .body {
  animation: pet-rest 5.6s ease-in-out infinite;
}

.pet[data-state='resting'] .aura {
  --pet-aura: rgba(120, 170, 255, 0.18);
}

/* 干活：轻快的上下点头，呆毛跟着提速摆。
   眼睛眯一点、瞳孔收一点——「专注」和待机的圆眼拉开差距。 */
.pet[data-state='working'] .body {
  animation: pet-work 1.5s ease-in-out infinite;
}

.pet[data-state='working'] .tip {
  animation-duration: 1.5s;
}

.pet[data-state='working'] .eyeLeft,
.pet[data-state='working'] .eyeRight {
  height: 14%;
}

.pet[data-state='working'] .pupil {
  width: 54%;
  height: 54%;
  margin: -27% 0 0 -27%;
}

.pet[data-state='working'] .aura {
  --pet-aura: rgba(74, 144, 226, 0.26);
}

/* 眉毛压低：专注是把眉压下去，不是抬起来。 */
.pet[data-state='working'] .browLeft {
  transform: rotate(-14deg) translateY(1px);
}

.pet[data-state='working'] .browRight {
  transform: rotate(14deg) translateY(1px);
}

.pet[data-state='working'] .mouth {
  width: 13%;
  height: 4%;
  margin-left: -6.5%;
  border-radius: 2px;
}

/* 等你：弹跳 + 竖瞳 + 挑眉。 */
.pet[data-state='waiting'] .body {
  background: conic-gradient(from 0deg, #f59e0b, #fbbf24, #fcd34d, #f59e0b, #d97706, #f59e0b);
  animation: pet-wait 1.05s ease-in-out infinite;
}

.pet[data-state='waiting'] .tip {
  animation-duration: 1.05s;
  background: linear-gradient(196deg, #fef3c7 0%, #fcd34d 48%, #f59e0b 100%);
}

.pet[data-state='waiting'] .aura {
  --pet-aura: rgba(245, 158, 11, 0.32);
  animation-duration: 1.6s;
}

.pet[data-state='waiting'] .eyeLeft,
.pet[data-state='waiting'] .eyeRight {
  height: 26%;
  animation-duration: 4.2s;
}

.pet[data-state='waiting'] .pupil {
  width: 44%;
  height: 72%;
  margin: -36% 0 0 -22%;
}

.pet[data-state='waiting'] .glint,
.pet[data-state='waiting'] .glintDot {
  display: none;
}

.pet[data-state='waiting'] .browLeft {
  transform: rotate(-18deg) translateY(-3px);
}

.pet[data-state='waiting'] .browRight {
  transform: rotate(18deg) translateY(-5px);
}

.pet[data-state='waiting'] .mouth {
  width: 9%;
  height: 11%;
  margin-left: -4.5%;
  border-radius: 50%;
  border: 2.5px solid light-dark(#1b1f24, #0b0d10);
  background: transparent;
}

/* 庆祝：起跳 + 星火 + 大笑。
   影子同步跳（次要动作）：身体升到最高点时影子最小最淡——
   没有影子联动的跳跃像悬浮，有联动才有重量。 */
.pet[data-state='celebrating'] .body {
  animation: pet-cheer 0.85s cubic-bezier(0.3, 0.9, 0.4, 1) 4;
}

.pet[data-state='celebrating'] .shadow {
  animation: pet-shadow-jump 0.85s cubic-bezier(0.3, 0.9, 0.4, 1) 4;
}

.pet[data-state='celebrating'] .tip {
  animation-duration: 0.85s;
}

.pet[data-state='celebrating'] .aura {
  --pet-aura: rgba(255, 193, 7, 0.42);
  animation-duration: 1.1s;
}

.pet[data-state='celebrating'] .sparkles {
  display: block;
}

.pet[data-state='celebrating'] .eyeLeft,
.pet[data-state='celebrating'] .eyeRight {
  animation: pet-happy 0.7s ease-in-out infinite;
}

/* 庆祝时眯眼笑：把瞳孔藏掉，只留一道弯——留着瞳孔会变成一条黑杠。 */
.pet[data-state='celebrating'] .pupil,
.pet[data-state='celebrating'] .glint,
.pet[data-state='celebrating'] .glintDot {
  display: none;
}

.pet[data-state='celebrating'] .browLeft {
  transform: rotate(-20deg) translateY(-4px);
}

.pet[data-state='celebrating'] .browRight {
  transform: rotate(20deg) translateY(-4px);
}

.pet[data-state='celebrating'] .blush {
  opacity: 0.95;
  transform: scale(1.15);
}

.pet[data-state='celebrating'] .mouth {
  width: 26%;
  height: 18%;
  margin-left: -13%;
  border-radius: 0 0 60% 60%;
  background: light-dark(#1b1f24, #0b0d10);
  border-bottom: 0;
}

.pet[data-state='celebrating'] .tongue {
  display: block;
}

.pet[data-state='celebrating'] .sparkle:nth-child(1) {
  top: 6%;
  left: 8%;
  animation: pet-sparkle 1s ease-in-out infinite;
}

.pet[data-state='celebrating'] .sparkle:nth-child(2) {
  top: 0%;
  right: 14%;
  animation: pet-sparkle 1s ease-in-out 0.2s infinite;
}

.pet[data-state='celebrating'] .sparkle:nth-child(3) {
  top: 24%;
  right: 0%;
  animation: pet-sparkle 1s ease-in-out 0.4s infinite;
}

/* 出错：红色 + 抖动 + 汗滴 + 苦脸；呆毛也蔫了（情绪要连贯到每个部件）。 */
.pet[data-state='error'] .body {
  background: conic-gradient(from 0deg, #ef4444, #f87171, #fca5a5, #ef4444, #dc2626, #ef4444);
  animation: pet-shake 0.62s ease-out 1;
}

.pet[data-state='error'] .tip {
  animation: pet-tip-wilt 3s ease-in-out infinite;
  background: linear-gradient(196deg, #fee2e2 0%, #fca5a5 48%, #ef4444 100%);
}

.pet[data-state='error'] .aura {
  --pet-aura: rgba(239, 68, 68, 0.34);
}

.pet[data-state='error'] .eyeLeft,
.pet[data-state='error'] .eyeRight {
  width: 13%;
  height: 9%;
  animation: none;
}

.pet[data-state='error'] .glint,
.pet[data-state='error'] .glintDot {
  display: none;
}

.pet[data-state='error'] .browLeft {
  transform: rotate(9deg) translateY(3px);
}

.pet[data-state='error'] .browRight {
  transform: rotate(-9deg) translateY(3px);
}

.pet[data-state='error'] .blush {
  opacity: 0.35;
}

.pet[data-state='error'] .mouth {
  width: 22%;
  height: 12%;
  margin-left: -11%;
  border-radius: 60% 60% 0 0;
  border-top: 2.5px solid light-dark(#1b1f24, #0b0d10);
  border-bottom: 0;
}

.pet[data-state='error'] .sweat {
  display: block;
  animation: pet-sweat 1.6s ease-in-out infinite;
}

/* 打盹：闭眼 + 变暗 + Zzz 上浮；呆毛无力的垂着，影子随呼吸同步起伏。
   降饱和但不降到发灰——「困」不是「褪色」。 */
.pet[data-state='sleeping'] .body {
  filter: saturate(0.72) brightness(0.95);
  animation: pet-sleep 5.4s ease-in-out infinite;
}

.pet[data-state='sleeping'] .tip {
  animation: pet-tip-droop 5.4s ease-in-out infinite;
}

.pet[data-state='sleeping'] .shadow {
  animation: pet-shadow-sleep 5.4s ease-in-out infinite;
}

.pet[data-state='sleeping'] .aura {
  --pet-aura: rgba(99, 102, 241, 0.2);
  animation-duration: 6s;
}

.pet[data-state='sleeping'] .eyeLeft,
.pet[data-state='sleeping'] .eyeRight {
  height: 4%;
  top: 46%;
  animation: none;
  background: light-dark(#1b1f24, #0b0d10);
}

.pet[data-state='sleeping'] .pupil,
.pet[data-state='sleeping'] .glint,
.pet[data-state='sleeping'] .glintDot {
  display: none;
}

.pet[data-state='sleeping'] .browLeft {
  transform: rotate(-2deg) translateY(2px);
}

.pet[data-state='sleeping'] .browRight {
  transform: rotate(2deg) translateY(2px);
}

.pet[data-state='sleeping'] .mouth {
  width: 8%;
  height: 4%;
  margin-left: -4%;
  border-radius: 0 0 60% 60%;
}

.pet[data-state='sleeping'] .zzz {
  display: block;
  animation: pet-zzz 3.2s ease-in-out infinite;
}

/* 拖拽中：悬空、微垂，动画暂停避免打架。 */
.pet[data-dragging='true'] .body {
  animation-play-state: paused;
}

.pet[data-dragging='true'] .shadow {
  transform: scale(0.72);
  opacity: 0.6;
}

.pet[data-dragging='true'] .eyeLeft,
.pet[data-dragging='true'] .eyeRight {
  height: 26%;
}

.pet[data-dragging='true'] .mouth {
  width: 8%;
  height: 12%;
  margin-left: -4%;
  border-radius: 50%;
  border: 2.5px solid light-dark(#1b1f24, #0b0d10);
  background: transparent;
}

/* ——— 一次性反应（连戳转圈 / 晕 / 摸摸 / 踉跄 / 伸懒腰）———
   全部挂在根的 data-* 上，到点由 JS 摘除；动画都是单次播放。 */

/* 连戳转圈：绕几何中心整圈（.motion 平时的转轴在底部，转圈必须换轴心）。 */
.pet[data-spin='true'] .motion {
  transform-origin: 50% 50%;
  animation: pet-spin 0.8s cubic-bezier(0.45, 0.05, 0.35, 1) 1;
}

/* 转完的晕：身体小幅画圈晃，眼睛换 ×。 */
.pet[data-dizzy='true'] .body {
  animation: pet-dizzy 1.25s ease-in-out 1;
}

.pet[data-dizzy='true'] .pupil,
.pet[data-dizzy='true'] .glint,
.pet[data-dizzy='true'] .glintDot {
  display: none;
}

.dizzyX {
  position: absolute;
  inset: 14%;
  display: none;
  pointer-events: none;
}

.pet[data-dizzy='true'] .dizzyX {
  display: block;
}

.dizzyX::before,
.dizzyX::after {
  content: '';
  position: absolute;
  left: 6%;
  right: 6%;
  top: 50%;
  height: 14%;
  margin-top: -7%;
  border-radius: 2px;
  background: light-dark(#1b1f24, #0b0d10);
}

.dizzyX::before {
  transform: rotate(45deg);
}

.dizzyX::after {
  transform: rotate(-45deg);
}

/* 摸摸：果冻鼓起，眯眼笑 + 腮红拉满——被rua到的满足感。 */
.pet[data-pat='true'] .body {
  animation: pet-pat 0.9s ease-out 1;
}

.pet[data-pat='true'] .eyeLeft,
.pet[data-pat='true'] .eyeRight {
  animation: pet-happy 0.5s ease-in-out infinite;
}

.pet[data-pat='true'] .pupil,
.pet[data-pat='true'] .glint,
.pet[data-pat='true'] .glintDot {
  display: none;
}

.pet[data-pat='true'] .blush {
  opacity: 1;
  transform: scale(1.25);
}

.pet[data-pat='true'] .mouth {
  width: 14%;
  height: 6%;
  margin-left: -7%;
}

/* 踉跄：窗口大小变了，地板在晃——重心左右找平衡。 */
.pet[data-stumble='true'] .body {
  animation: pet-stumble 0.72s ease-out 1;
}

/* 睡醒伸懒腰：纵向拉长再回弹，像把一夜的觉都舒展开。 */
.pet[data-stretch='true'] .body {
  animation: pet-stretch 0.95s ease-out 1;
}

/* 惊醒：打盹中被戳——猛地弹起、落地一抖（起床气）。 */
.pet[data-startle='true'] .body {
  animation: pet-startle 0.62s ease-out 1;
}

/* 落地：拖拽松手后的一记小弹跳——被「放下来」，不是被「传送」。 */
.pet[data-land='true'] .body {
  animation: pet-land 0.46s cubic-bezier(0.3, 0.8, 0.4, 1) 1;
}

/* 哼小曲：闲得自在，抱着手轻轻摇。 */
.pet[data-hum='true'] .body {
  animation: pet-hum 1.8s ease-in-out 1;
}

/* ——— 入场动画（登场时 JS 随机挑一个，播完即摘）———
   每次出现方式都不同：弹现 / 空降 / 旋转 / 蹦入——重逢才有惊喜。
   都挂在 .motion 上（整只一起动），影子留在原地等它落地。 */
.pet[data-entrance='pop'] .motion {
  animation: pet-enter-pop 0.62s cubic-bezier(0.2, 1.4, 0.4, 1) 1;
}

.pet[data-entrance='drop'] .motion {
  animation: pet-enter-drop 0.76s cubic-bezier(0.3, 0.9, 0.4, 1) 1;
}

.pet[data-entrance='spin'] .motion {
  transform-origin: 50% 50%;
  animation: pet-enter-spin 0.78s cubic-bezier(0.3, 0.8, 0.3, 1) 1;
}

.pet[data-entrance='hop'] .motion {
  animation: pet-enter-hop 0.7s ease-out 1;
}

/* ——— 动画强度（设置面板三档）———
   off：用户主动关动画，与系统级「减弱动态效果」等效——表情仍可读，
   只是不再动；subtle：保留全部反应但幅度收敛，把「弹跳」换成「浮动」。 */
.pet[data-motion='off'] .body,
.pet[data-motion='off'] .aura,
.pet[data-motion='off'] .tip,
.pet[data-motion='off'] .motion,
.pet[data-motion='off'] .eyeLeft,
.pet[data-motion='off'] .eyeRight,
.pet[data-motion='off'] .shadow,
.pet[data-motion='off'] .sparkle,
.pet[data-motion='off'] .sweat,
.pet[data-motion='off'] .zzz,
.pet[data-motion='off'] .shock,
.pet[data-motion='off'] .heart {
  animation: none !important;
}

.pet[data-motion='off'] .pupil,
.pet[data-motion='off'] .glint,
.pet[data-motion='off'] .glintDot {
  transition: none !important;
}

.pet[data-motion='subtle'][data-state='working'] .body {
  animation: pet-work-calm 2.2s ease-in-out infinite;
}

.pet[data-motion='subtle'][data-state='waiting'] .body {
  animation: pet-wait-calm 1.8s ease-in-out infinite;
}

.pet[data-motion='subtle'][data-state='celebrating'] .body {
  animation: pet-cheer-calm 1.3s ease-in-out 3;
}

.pet[data-motion='subtle'][data-state='celebrating'] .shadow {
  animation: none;
}

.pet[data-motion='subtle'][data-stumble='true'] .body {
  animation: pet-stumble-calm 0.8s ease-out 1;
}

/* ——— 关键帧 ——— */

/* 呆毛轻摆：幅度小、带一点迟滞——像被风吹，不像钟摆。 */
@keyframes pet-tip {
  0%, 100% { transform: rotate(26deg) scaleY(1); }
  32% { transform: rotate(21deg) scaleY(1.07); }
  68% { transform: rotate(31deg) scaleY(0.96); }
}

/* 打盹时呆毛垂下：角度更大（耷拉），几乎不摆。 */
@keyframes pet-tip-droop {
  0%, 100% { transform: rotate(43deg) scaleY(0.86); }
  50% { transform: rotate(46deg) scaleY(0.9); }
}

/* 出错时呆毛蔫掉：垂得更低，无精打采地小幅晃。 */
@keyframes pet-tip-wilt {
  0%, 100% { transform: rotate(52deg) scaleY(0.8); }
  50% { transform: rotate(57deg) scaleY(0.84); }
}

@keyframes pet-rest {
  0%, 100% { transform: translateY(0) rotate(0deg) scaleY(1); }
  30% { transform: translateY(-2.5px) rotate(-1.4deg) scaleY(1.025); }
  65% { transform: translateY(0) rotate(1.4deg) scaleY(0.99); }
}

@keyframes pet-work {
  0%, 100% { transform: translateY(0) rotate(-2.6deg); }
  50% { transform: translateY(-7px) rotate(2.6deg); }
}

@keyframes pet-wait {
  0%, 100% { transform: translateY(0) rotate(-3.5deg); }
  50% { transform: translateY(-10px) rotate(3.5deg); }
}

@keyframes pet-cheer {
  0% { transform: translateY(0) scale(1, 1); }
  14% { transform: translateY(3px) scale(1.09, 0.9); }
  44% { transform: translateY(-20px) scale(0.94, 1.07); }
  70% { transform: translateY(0) scale(1.06, 0.93); }
  86% { transform: translateY(-4px) scale(0.99, 1.02); }
  100% { transform: translateY(0) scale(1, 1); }
}

@keyframes pet-shake {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  20% { transform: translateX(-5px) rotate(-3deg); }
  40% { transform: translateX(5px) rotate(3deg); }
  60% { transform: translateX(-3px) rotate(-2deg); }
  80% { transform: translateX(2px) rotate(1deg); }
}

@keyframes pet-sleep {
  0%, 100% { transform: translateY(0) rotate(-4deg) scale(1, 1); }
  50% { transform: translateY(2.5px) rotate(-4deg) scale(1.02, 1.045); }
}

/* 眨眼：7.4 秒一轮，三次眨（其中一次是连眨），不规律才像活的。 */
@keyframes pet-blink {
  0%, 34% { transform: scaleY(1); }
  36%, 37.4% { transform: scaleY(0.08); }
  38%, 39% { transform: scaleY(1); }
  42%, 43.4% { transform: scaleY(0.08); }
  44%, 100% { transform: scaleY(1); }
}

/* 庆祝时眯眼笑。 */
@keyframes pet-happy {
  0%, 100% { transform: scaleY(0.42); }
  50% { transform: scaleY(0.26); }
}

@keyframes pet-aura {
  0%, 100% { opacity: 0.75; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}

@keyframes pet-sparkle {
  0%, 100% { opacity: 0.25; transform: scale(0.7); }
  50% { opacity: 1; transform: scale(1.15); }
}

@keyframes pet-sweat {
  0%, 100% { opacity: 0.35; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(4px); }
}

@keyframes pet-zzz {
  0% { opacity: 0; transform: translateY(6px) scale(0.8); }
  40% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-14px) scale(1.1); }
}

@keyframes pet-shock {
  0% { opacity: 0.9; transform: scale(0.6); }
  100% { opacity: 0; transform: scale(2.6); }
}

/* 庆祝跳跃的影子联动：与 pet-cheer 同周期，44% 处身体到最高点
   （translateY(-20px)），影子同步收到最小最淡。 */
@keyframes pet-shadow-jump {
  0%, 100% { transform: scale(1); opacity: 1; }
  14% { transform: scale(1.08); opacity: 1; }
  44% { transform: scale(0.55); opacity: 0.4; }
  70% { transform: scale(1.05); opacity: 0.9; }
}

/* 打盹呼吸的影子联动：身体变宽时影子也微放大。 */
@keyframes pet-shadow-sleep {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.06); opacity: 1; }
}

/* 连戳转圈：起转稍缓、甩过头顶稍快，结尾回正——不是匀速风车。 */
@keyframes pet-spin {
  0% { transform: rotate(0deg) scale(1, 1); }
  40% { transform: rotate(190deg) scale(1.04, 0.97); }
  88% { transform: rotate(374deg) scale(0.99, 1.02); }
  100% { transform: rotate(360deg) scale(1, 1); }
}

/* 晕：左右缓晃，幅度递减——像天旋地转在慢慢停。 */
@keyframes pet-dizzy {
  0% { transform: rotate(-7deg) translateX(-2px); }
  22% { transform: rotate(5deg) translateX(2px); }
  48% { transform: rotate(-4deg) translateX(-1px); }
  74% { transform: rotate(2.5deg) translateX(1px); }
  100% { transform: rotate(0deg) translateX(0); }
}

/* 摸摸：先鼓起（被按出坑再弹回来），再果冻似的晃两下。 */
@keyframes pet-pat {
  0% { transform: scale(1, 1); }
  28% { transform: scale(1.16, 0.86); }
  52% { transform: scale(0.93, 1.11); }
  74% { transform: scale(1.05, 0.97); }
  100% { transform: scale(1, 1); }
}

/* 踉跄：重心左右找平衡，每一下都比上一下小。 */
@keyframes pet-stumble {
  0% { transform: rotate(0deg) translateX(0); }
  16% { transform: rotate(-12deg) translateX(-3px) scale(1.03, 0.97); }
  38% { transform: rotate(9deg) translateX(2px); }
  58% { transform: rotate(-6deg) translateX(-1.5px); }
  78% { transform: rotate(3deg) translateX(1px); }
  100% { transform: rotate(0deg) translateX(0); }
}

@keyframes pet-stumble-calm {
  0%, 100% { transform: rotate(0deg) translateX(0); }
  25% { transform: rotate(-5deg) translateX(-1.5px); }
  55% { transform: rotate(4deg) translateX(1px); }
  80% { transform: rotate(-2deg); }
}

/* 伸懒腰：纵向拉长、踮起脚尖，再泄气回弹。 */
@keyframes pet-stretch {
  0% { transform: scale(1, 1) translateY(0); }
  38% { transform: scale(0.92, 1.18) translateY(-4px); }
  66% { transform: scale(1.05, 0.96) translateY(1px); }
  84% { transform: scale(0.99, 1.02); }
  100% { transform: scale(1, 1) translateY(0); }
}

/* 惊醒：猛地弹到最高点缩成一条，落地压扁再抖两下。 */
@keyframes pet-startle {
  0% { transform: translateY(0) scale(1, 1); }
  18% { transform: translateY(-16px) scale(0.9, 1.12); }
  42% { transform: translateY(0) scale(1.12, 0.88); }
  62% { transform: translateY(-4px) scale(0.98, 1.03); }
  82% { transform: translateY(0) scale(1.04, 0.97); }
  100% { transform: translateY(0) scale(1, 1); }
}

/* 落地：先压缩蓄力感（从半空落下），压扁、回弹、归位。 */
@keyframes pet-land {
  0% { transform: translateY(-4px) scale(0.96, 1.05); }
  38% { transform: translateY(0) scale(1.1, 0.9); }
  70% { transform: translateY(-2px) scale(0.98, 1.02); }
  100% { transform: translateY(0) scale(1, 1); }
}

/* 哼小曲：小幅、慢速的左右摇——自得其乐的节奏。 */
@keyframes pet-hum {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  30% { transform: translateY(-2px) rotate(-4deg); }
  65% { transform: translateY(0) rotate(4deg); }
}

/* 入场·弹现：从零弹出，过头一回再归位。 */
@keyframes pet-enter-pop {
  0% { transform: scale(0); opacity: 0; }
  55% { transform: scale(1.14); opacity: 1; }
  78% { transform: scale(0.95); }
  100% { transform: scale(1); }
}

/* 入场·空降：从上方落下，落地压扁、小弹一下。 */
@keyframes pet-enter-drop {
  0% { transform: translateY(-44px); }
  62% { transform: translateY(0) scale(1.12, 0.88); }
  80% { transform: translateY(-6px) scale(0.97, 1.04); }
  100% { transform: translateY(0) scale(1); }
}

/* 入场·旋转：倒着缩着转进来，甩过头再回正。 */
@keyframes pet-enter-spin {
  0% { transform: rotate(-200deg) scale(0.3); opacity: 0; }
  45% { opacity: 1; }
  70% { transform: rotate(12deg) scale(1.05); }
  100% { transform: rotate(0deg) scale(1); }
}

/* 入场·蹦入：从左侧两步蹦进来，最后站稳。 */
@keyframes pet-enter-hop {
  0% { transform: translateX(-38px) scale(0.7); opacity: 0; }
  30% { transform: translateX(-16px) translateY(-8px) scale(1.04, 0.96); opacity: 1; }
  55% { transform: translateX(4px) translateY(0) scale(0.96, 1.05); }
  78% { transform: translateX(0) translateY(-3px) scale(1.02, 0.98); }
  100% { transform: translateX(0) scale(1); }
}

/* 轻柔档的状态动画：保留节奏，去掉弹跳与位移幅度。 */
@keyframes pet-work-calm {
  0%, 100% { transform: translateY(0) rotate(-1.1deg); }
  50% { transform: translateY(-2.5px) rotate(1.1deg); }
}

@keyframes pet-wait-calm {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  50% { transform: translateY(-3px) scale(1.015, 0.99); }
}

@keyframes pet-cheer-calm {
  0%, 100% { transform: translateY(0); }
  45% { transform: translateY(-6px) scale(0.985, 1.025); }
  70% { transform: translateY(0) scale(1.015, 0.99); }
}

@keyframes pet-heart {
  0% { opacity: 0; transform: translateY(0) scale(0.4); }
  25% { opacity: 1; transform: translateY(-10px) scale(1.1); }
  100% { opacity: 0; transform: translateY(-42px) scale(0.85); }
}

/* 用户开启「减弱动态效果」时停掉全部动画，状态仍然可读。
   系统级设置压过用户档位：即便偏好是「全量」，OS 说减就减。 */
@media (prefers-reduced-motion: reduce) {
  .body,
  .aura,
  .tip,
  .motion,
  .eyeLeft,
  .eyeRight,
  .shadow,
  .sparkle,
  .sweat,
  .zzz,
  .shock,
  .heart {
    animation: none !important;
  }

  .pupil,
  .glint,
  .glintDot {
    transition: none !important;
  }
}

/* 预览页的排版：把桌宠从「固定在窗口右下角」改成「排成一行」。
   尺寸按窄视口（≈680px）定，三列刚好放得下——宽屏也不会散开。 */
body { margin: 0; padding: 24px; background: #f6f7f9; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
h1 { margin: 0 0 16px; font-size: 17px; font-weight: 600; color: #222; }
.grid { display: grid; grid-template-columns: repeat(3, max-content); gap: 14px; }
.cell { margin: 0; padding: 12px; background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.stage { position: relative; width: 112px; height: 112px; }
.stage .pet { position: absolute; inset: 0; width: 112px !important; height: 112px !important; }
figcaption { margin-top: 8px; font-size: 12px; color: #555; text-align: center; }
code { color: #999; }
</style>
</head>
<body>
<h1>小虹 · 六种表情</h1>
<div class="grid">
<figure class="cell"><div class="stage"><div class="pet" data-state="resting" data-dragging="false" data-remote="connected" data-motion="full">
  <span class="aura"></span>
  <span class="bubble" data-visible="false"></span>
  <button type="button" class="hit">
    <span class="motion">
      <span class="body">
        <span class="tip"></span>
        <span class="sheen"></span>
        <span class="rim"></span>
        <span class="face">
          <span class="eyeLeft"><span class="pupil"></span><span class="glint"></span><span class="glintDot"></span><span class="dizzyX"></span></span>
          <span class="eyeRight"><span class="pupil"></span><span class="glint"></span><span class="glintDot"></span><span class="dizzyX"></span></span>
          <span class="browLeft"></span>
          <span class="browRight"></span>
          <span class="blushLeft"></span>
          <span class="blushRight"></span>
          <span class="mouth"><span class="tongue"></span></span>
        </span>
        <span class="sweat"></span>
