<!doctype html>
<html lang="zh" data-rainbow-glow="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RainbowSpeak 柔光预览（默认 extent 14px / blur 5px / opacity 0.6）</title>
<style>

/* 默认变量：偏好服务在 <html> 上以内联样式覆盖（inline 优先于 :root 声明）。 */
:root {
  --dsh-rainbow-width: 2px;
  --dsh-rainbow-period: 4s;
  --dsh-rainbow-direction: normal;
  /* 柔光层几何（调参入口，非用户偏好）：extent = 光晕外扩距离，
     blur = 模糊半径（≈外缘衰减 2.8σ，须显著小于 extent），
     opacity = 光晕相对细线的强度。 */
  --dsh-rainbow-glow-extent: 14px;
  --dsh-rainbow-glow-blur: 5px;
  --dsh-rainbow-glow-opacity: 0.6;
}

/* 宿主输入框卡片（ui-conversation InputBar 的稳定 data 锚点）。 */
[data-composer-card] {
  position: relative;
}

/* 静态兜底：旋转图层还没挂上时，至少有一圈彩虹描边（不流动）。 */
[data-composer-card]::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: var(--dsh-rainbow-width);
  background: conic-gradient(from 0deg, #38bdf8, #818cf8, #c084fc, #f472b6, #fb7185, #fb923c, #fbbf24, #a3e635, #34d399, #22d3ee, #38bdf8);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  pointer-events: none;
  transition: filter 0.3s ease;
}

/* 卡片上已有旋转图层：静态兜底退场，避免两层色带叠加。 */
[data-composer-card].rs-has-ring::before {
  display: none;
}

/* ——— 旋转图层 ———
   载体层只管遮罩（把渐变挖成边缘一圈色带），形状永远不动；
   色彩层是一张正方形锥形渐变，绕卡片中心自转。
   正方形是硬要求：扁矩形绕中心转只盖得住中心附近的窄扇区，
   卡片左右会露出底层渐变（实测 130° 色相断层）。 */
[data-composer-card] .rs-ring {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: var(--dsh-rainbow-width);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  overflow: hidden;
  pointer-events: none;
}

[data-composer-card] .rs-conic {
  position: absolute;
  left: 50%;
  top: 50%;
  /* 边长 = 卡片宽度的两倍：内切圆半径 = 卡片宽度，够盖住卡片对角线的一半
     （卡片高 ≤ 1.73 倍宽时成立；输入框卡片是宽扁的，这条恒成立）。 */
  width: 200%;
  aspect-ratio: 1 / 1;
  /* 居中用独立的 translate 属性：与 transform(rotate) 分开写，互不覆盖。 */
  translate: -50% -50%;
  background: conic-gradient(from 0deg, #38bdf8, #818cf8, #c084fc, #f472b6, #fb7185, #fb923c, #fbbf24, #a3e635, #34d399, #22d3ee, #38bdf8);
  animation: dsh-rainbow-spin var(--dsh-rainbow-period) linear infinite;
  animation-direction: var(--dsh-rainbow-direction);
  will-change: transform;
}

@keyframes dsh-rainbow-spin {
  to { transform: rotate(360deg); }
}

/* ——— 柔光层（静态光晕，默认隐藏，<html data-rainbow-glow> 点亮）———
   外层 .rs-glow 管 blur 与挖洞，内层 .rs-glow-band 是一条贴着卡片内缘、
   比细线宽 2px 的锥形渐变条带。分工缘于渲染管线：filter 先于 mask 执行，
   blur 与条带遮罩同层会被 mask 切回硬边，故拆成父子两层。可见光晕的
   推导：条带画在卡片内缘 → 父层 blur 把颜色推过卡片边界 → 父层挖洞
   mask（content-box = 卡片区域）只放行卡片以外的部分。内缘的硬切被
   细线盖住，外缘切边在 extent 处而 blur 衰减已尽，两头都不可见。
   条带刻意不自转：旋转内容上的 blur 必须逐帧重跑，静态条带模糊一次
   后由合成器缓存，稳态零逐帧成本。 */
[data-composer-card] .rs-glow {
  display: none;
}

html[data-rainbow-glow] [data-composer-card] .rs-glow {
  display: block;
  position: absolute;
  /* 外扩 extent 给光晕留活动空间；padding 同值让 content-box 恰好回到卡片区域。 */
  inset: calc(-1 * var(--dsh-rainbow-glow-extent));
  padding: var(--dsh-rainbow-glow-extent);
  border-radius: inherit;
  filter: blur(var(--dsh-rainbow-glow-blur));
  /* 挖洞：卡片区域（content-box）抠掉，输入区不落一丝光。 */
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  pointer-events: none;
}

[data-composer-card] .rs-glow-band {
  position: absolute;
  /* inset extent 从 .rs-glow 的外扩框回到卡片边界，条带与细线同位。 */
  inset: var(--dsh-rainbow-glow-extent);
  border-radius: inherit;
  /* 比细线宽 2px：blur 会侵蚀条带边缘，加宽一点补回被侵蚀的亮度。 */
  padding: calc(var(--dsh-rainbow-width) + 2px);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  /* 强度落在条带上而不是 .rs-glow 上：呼吸/脉冲动画动的是 .rs-glow 的
     opacity，放同层会被动画的 opacity 覆盖成 1。 */
  opacity: var(--dsh-rainbow-glow-opacity);
  background: conic-gradient(from 0deg, #38bdf8, #818cf8, #c084fc, #f472b6, #fb7185, #fb923c, #fbbf24, #a3e635, #34d399, #22d3ee, #38bdf8);
  pointer-events: none;
}


/* 配色方案：rainbow。 */
html[data-rainbow-palette="rainbow"] [data-composer-card]::before {
  background: conic-gradient(from 0deg, #38bdf8, #818cf8, #c084fc, #f472b6, #fb7185, #fb923c, #fbbf24, #a3e635, #34d399, #22d3ee, #38bdf8);
}

html[data-rainbow-palette="rainbow"] [data-composer-card] .rs-conic,
html[data-rainbow-palette="rainbow"] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #38bdf8, #818cf8, #c084fc, #f472b6, #fb7185, #fb923c, #fbbf24, #a3e635, #34d399, #22d3ee, #38bdf8);
}

/* 配色方案：aurora。 */
html[data-rainbow-palette="aurora"] [data-composer-card]::before {
  background: conic-gradient(from 0deg, #22d3ee, #34d399, #4ade80, #a7f3d0, #2dd4bf, #38bdf8, #818cf8, #22d3ee);
}

html[data-rainbow-palette="aurora"] [data-composer-card] .rs-conic,
html[data-rainbow-palette="aurora"] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #22d3ee, #34d399, #4ade80, #a7f3d0, #2dd4bf, #38bdf8, #818cf8, #22d3ee);
}

/* 配色方案：sunset。 */
html[data-rainbow-palette="sunset"] [data-composer-card]::before {
  background: conic-gradient(from 0deg, #fbbf24, #fb923c, #f87171, #e879f9, #a855f7, #6366f1, #f97316, #fbbf24);
}

html[data-rainbow-palette="sunset"] [data-composer-card] .rs-conic,
html[data-rainbow-palette="sunset"] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #fbbf24, #fb923c, #f87171, #e879f9, #a855f7, #6366f1, #f97316, #fbbf24);
}

/* 配色方案：peach。 */
html[data-rainbow-palette="peach"] [data-composer-card]::before {
  background: conic-gradient(from 0deg, #fecaca, #fda4af, #f472b6, #fbcfe8, #fcd34d, #fdba74, #f9a8d4, #fecaca);
}

html[data-rainbow-palette="peach"] [data-composer-card] .rs-conic,
html[data-rainbow-palette="peach"] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #fecaca, #fda4af, #f472b6, #fbcfe8, #fcd34d, #fdba74, #f9a8d4, #fecaca);
}

/* 配色方案：ocean。 */
html[data-rainbow-palette="ocean"] [data-composer-card]::before {
  background: conic-gradient(from 0deg, #0ea5e9, #38bdf8, #818cf8, #6366f1, #22d3ee, #0ea5e9);
}

html[data-rainbow-palette="ocean"] [data-composer-card] .rs-conic,
html[data-rainbow-palette="ocean"] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #0ea5e9, #38bdf8, #818cf8, #6366f1, #22d3ee, #0ea5e9);
}

/* 配色方案：cyberpunk。 */
html[data-rainbow-palette="cyberpunk"] [data-composer-card]::before {
  background: conic-gradient(from 0deg, #00f0ff, #7b2ff7 28%, #ff2a6d 48%, #c800a8 62%, #00f0ff 78%, #d8feff 86%, #00f0ff 100%);
}

html[data-rainbow-palette="cyberpunk"] [data-composer-card] .rs-conic,
html[data-rainbow-palette="cyberpunk"] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #00f0ff, #7b2ff7 28%, #ff2a6d 48%, #c800a8 62%, #00f0ff 78%, #d8feff 86%, #00f0ff 100%);
}

/* 配色方案：theme。 */
html[data-rainbow-palette="theme"] [data-composer-card]::before {
  background: conic-gradient(from 0deg, var(--dsw-alias-button-info-fill), color-mix(in srgb, var(--dsw-alias-button-info-fill) 65%, white), color-mix(in srgb, var(--dsw-alias-button-info-fill) 72%, #0ea5e9), color-mix(in srgb, var(--dsw-alias-button-info-fill) 70%, black), var(--dsw-alias-button-info-fill));
}

html[data-rainbow-palette="theme"] [data-composer-card] .rs-conic,
html[data-rainbow-palette="theme"] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, var(--dsw-alias-button-info-fill), color-mix(in srgb, var(--dsw-alias-button-info-fill) 65%, white), color-mix(in srgb, var(--dsw-alias-button-info-fill) 72%, #0ea5e9), color-mix(in srgb, var(--dsw-alias-button-info-fill) 70%, black), var(--dsw-alias-button-info-fill));
}

/* 显示位置：仅顶边（mask 只保留顶部条带，颜色仍是环上对应弧段，随角度流动）。 */
html[data-rainbow-side="top"] [data-composer-card]::before,
html[data-rainbow-side="top"] [data-composer-card] .rs-ring {
  -webkit-mask: linear-gradient(180deg, #fff 0 var(--dsh-rainbow-width), transparent var(--dsh-rainbow-width));
  mask: linear-gradient(180deg, #fff 0 var(--dsh-rainbow-width), transparent var(--dsh-rainbow-width));
}

/* 仅顶边时柔光条带同步收成顶部条带（高度比细线多 2px，补 blur 侵蚀）。 */
html[data-rainbow-side="top"] [data-composer-card] .rs-glow-band {
  -webkit-mask: linear-gradient(180deg, #fff 0 calc(var(--dsh-rainbow-width) + 2px), transparent calc(var(--dsh-rainbow-width) + 2px));
  mask: linear-gradient(180deg, #fff 0 calc(var(--dsh-rainbow-width) + 2px), transparent calc(var(--dsh-rainbow-width) + 2px));
}

/* 显示位置：仅底边。 */
html[data-rainbow-side="bottom"] [data-composer-card]::before,
html[data-rainbow-side="bottom"] [data-composer-card] .rs-ring {
  -webkit-mask: linear-gradient(180deg, transparent calc(100% - var(--dsh-rainbow-width)), #fff calc(100% - var(--dsh-rainbow-width)));
  mask: linear-gradient(180deg, transparent calc(100% - var(--dsh-rainbow-width)), #fff calc(100% - var(--dsh-rainbow-width)));
}

/* 仅底边时柔光条带同步收成底部条带。 */
html[data-rainbow-side="bottom"] [data-composer-card] .rs-glow-band {
  -webkit-mask: linear-gradient(180deg, transparent calc(100% - var(--dsh-rainbow-width) - 2px), #fff calc(100% - var(--dsh-rainbow-width) - 2px));
  mask: linear-gradient(180deg, transparent calc(100% - var(--dsh-rainbow-width) - 2px), #fff calc(100% - var(--dsh-rainbow-width) - 2px));
}

/* 呼吸明暗：叠加在载体层上（opacity 走合成器）。 */
@keyframes dsh-rainbow-breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

html[data-rainbow-breathe] [data-composer-card]::before {
  animation: dsh-rainbow-breathe calc(var(--dsh-rainbow-period) * 2) ease-in-out infinite;
}

html[data-rainbow-breathe] [data-composer-card] .rs-ring {
  animation: dsh-rainbow-breathe calc(var(--dsh-rainbow-period) * 2) ease-in-out infinite;
}

/* 呼吸同频作用在柔光层上：opacity 动画叠加在条带的静态强度之上。 */
html[data-rainbow-breathe] [data-composer-card] .rs-glow {
  animation: dsh-rainbow-breathe calc(var(--dsh-rainbow-period) * 2) ease-in-out infinite;
}

/* 会话运行中：流动加速（状态桥把 running 投影到 <html data-rainbow-state>）。 */
html[data-rainbow-state="running"] [data-composer-card] {
  --dsh-rainbow-period: 1.2s;
}

/* 审批等待：琥珀色配色 + 缓慢脉冲（pendingInteraction 由状态桥投影）。
   配色必须跟着状态走——颜色在这套产品里是语义（琥珀 = 需要你确认）。 */
html[data-rainbow-state="attention"] [data-composer-card]::before,
html[data-rainbow-state="attention"] [data-composer-card] .rs-conic,
html[data-rainbow-state="attention"] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #f59e0b, #fbbf24, #fcd34d, #f59e0b, #d97706, #f59e0b);
}

html[data-rainbow-state="attention"] [data-composer-card] .rs-conic {
  animation-duration: 3s;
}

/* 会话出错：红色警示配色 + 快速脉冲。 */
html[data-rainbow-state="error"] [data-composer-card]::before,
html[data-rainbow-state="error"] [data-composer-card] .rs-conic,
html[data-rainbow-state="error"] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #ef4444, #f87171, #fca5a5, #ef4444, #dc2626, #ef4444);
}

html[data-rainbow-state="error"] [data-composer-card] .rs-conic {
  animation-duration: 1s;
}

@keyframes dsh-rainbow-error-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

html[data-rainbow-state="attention"] [data-composer-card] .rs-ring {
  animation: dsh-rainbow-error-pulse 2s ease-in-out infinite;
}

html[data-rainbow-state="error"] [data-composer-card] .rs-ring {
  animation: dsh-rainbow-error-pulse 1.2s ease-in-out infinite;
}

/* 状态脉冲同步到柔光层（opacity 动画，与条带强度相乘）。 */
html[data-rainbow-state="attention"] [data-composer-card] .rs-glow {
  animation: dsh-rainbow-error-pulse 2s ease-in-out infinite;
}

html[data-rainbow-state="error"] [data-composer-card] .rs-glow {
  animation: dsh-rainbow-error-pulse 1.2s ease-in-out infinite;
}

/* 回合完成庆祝：快转一圈并提亮回落（标记由状态桥 0.9s 后移除）。
   首尾 opacity 都等于常态 1，起止平滑。 */
@keyframes dsh-rainbow-celebrate {
  0% { opacity: 1; }
  40% { opacity: 1; }
  60% { opacity: 0.4; }
  100% { opacity: 1; }
}

html[data-rainbow-celebrate] [data-composer-card]::before {
  animation: dsh-rainbow-celebrate 0.9s ease-out 1;
}

html[data-rainbow-celebrate] [data-composer-card] .rs-conic {
  animation: dsh-rainbow-spin 0.9s linear 1;
}

html[data-rainbow-celebrate] [data-composer-card] .rs-ring {
  animation: dsh-rainbow-celebrate 0.9s ease-out 1;
}

/* 庆祝闪动与细线同帧落在柔光层上。 */
html[data-rainbow-celebrate] [data-composer-card] .rs-glow {
  animation: dsh-rainbow-celebrate 0.9s ease-out 1;
}

/* 输入框聚焦时环更亮更饱和，失焦平滑回落。
   柔光层的提亮加在 .rs-glow-band（子层）上——.rs-glow 自带 blur filter，
   在它上面再设 filter 会把 blur 顶掉，光晕瞬间变硬边。 */
[data-composer-card]:focus-within::before,
[data-composer-card]:focus-within .rs-ring,
[data-composer-card]:focus-within .rs-glow-band {
  filter: brightness(1.25) saturate(1.15);
}

/* 总开关关闭：隐藏伪元素、旋转图层与柔光层（偏好服务在 <html data-rainbow-off> 上打标记）。 */
html[data-rainbow-off] [data-composer-card]::before,
html[data-rainbow-off] [data-composer-card] .rs-ring,
html[data-rainbow-off] [data-composer-card] .rs-glow {
  display: none;
}

/* 用户开启"减弱动态效果"时停用全部动画，保留静态描边与静态光晕。 */
@media (prefers-reduced-motion: reduce) {
  [data-composer-card]::before {
    animation: none;
  }

  [data-composer-card] .rs-conic,
  [data-composer-card] .rs-ring,
  [data-composer-card] .rs-glow {
    animation: none !important;
  }
}


:root { --dsw-alias-button-info-fill: #4d6bfe; }
html, body { margin: 0; }
body {
  font: 13px/1.6 system-ui, -apple-system, 'PingFang SC', sans-serif;
  background: #0d1117;
  color: #d7dde5;
  padding-bottom: 48px;
}
.controls {
  position: sticky; top: 0; z-index: 10;
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  padding: 10px 16px;
  background: #0d1117ee; backdrop-filter: blur(8px);
  border-bottom: 1px solid #2a323d;
}
.controls label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.controls select, .controls input[type='range'] { accent-color: #4d6bfe; }
.controls .grow { flex: 1; }
.stage { padding: 44px 40px 12px; }
.stage h2 { margin: 0 0 18px; font-size: 14px; font-weight: 600; color: #9aa7b5; }
.stage .cards { display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start; }
.stage-light { background: #eef1f5; color: #333a44; }
.stage-light h2 { color: #66707d; }
.card {
  position: relative;
  width: 480px; height: 64px;
  border-radius: 14px;
  background: #1b2129;
  box-shadow: 0 6px 24px #0006;
}
.stage-light .card { background: #ffffff; box-shadow: 0 6px 18px #0002; }
.card .fill { position: absolute; inset: 10px 14px; border-radius: 9px; background: #242c36; }
.stage-light .card .fill { background: #f2f4f8; }
.matrix { padding: 8px 40px 0; }
.matrix h2 { font-size: 14px; font-weight: 600; color: #9aa7b5; margin: 28px 0 10px; }
.tiles { display: flex; flex-wrap: wrap; gap: 14px; }
.tile { display: flex; flex-direction: column; gap: 6px; }
.tile iframe { width: 300px; height: 110px; border: 1px solid #2a323d; border-radius: 10px; background: #0d1117; }
.tile span { font-size: 12px; color: #9aa7b5; }

</style>
</head>
<body>
<div class="controls">
  <label><input type="checkbox" id="glow" checked> 柔光</label>
  <label>配色 <select id="palette">
    <option value="rainbow">经典彩虹</option><option value="aurora">极光</option>
    <option value="sunset">日落</option><option value="peach">蜜桃</option>
    <option value="ocean">海洋</option><option value="cyberpunk">赛博</option>
    <option value="theme">跟随主题</option>
  </select></label>
  <label>位置 <select id="side">
    <option value="all">四边</option><option value="top">仅顶边</option><option value="bottom">仅底边</option>
  </select></label>
  <label>状态 <select id="state">
    <option value="">常态</option><option value="running">运行</option>

/* ——— 旋转图层 ———
   载体层只管遮罩（把渐变挖成边缘一圈色带），形状永远不动；
   色彩层是一张正方形锥形渐变，绕卡片中心自转。
   正方形是硬要求：扁矩形绕中心转只盖得住中心附近的窄扇区，
   卡片左右会露出底层渐变（实测 130° 色相断层）。 */
[data-composer-card] .rs-ring {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: var(--dsh-rainbow-width);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  overflow: hidden;
  pointer-events: none;
}

[data-composer-card] .rs-conic {
  position: absolute;
  left: 50%;
  top: 50%;
  /* 边长 = 卡片宽度的两倍：内切圆半径 = 卡片宽度，够盖住卡片对角线的一半
     （卡片高 ≤ 1.73 倍宽时成立；输入框卡片是宽扁的，这条恒成立）。 */
  width: 200%;
  aspect-ratio: 1 / 1;
  /* 居中用独立的 translate 属性：与 transform(rotate) 分开写，互不覆盖。 */
  translate: -50% -50%;
  background: conic-gradient(from 0deg, #38bdf8, #818cf8, #c084fc, #f472b6, #fb7185, #fb923c, #fbbf24, #a3e635, #34d399, #22d3ee, #38bdf8);
  animation: dsh-rainbow-spin var(--dsh-rainbow-period) linear infinite;
  animation-direction: var(--dsh-rainbow-direction);
  will-change: transform;
}

@keyframes dsh-rainbow-spin {
  to { transform: rotate(360deg); }
}

/* ——— 柔光层（静态光晕，默认隐藏，<html data-rainbow-glow> 点亮）———
   外层 .rs-glow 管 blur 与挖洞，内层 .rs-glow-band 是一条贴着卡片内缘、
   比细线宽 2px 的锥形渐变条带。分工缘于渲染管线：filter 先于 mask 执行，
   blur 与条带遮罩同层会被 mask 切回硬边，故拆成父子两层。可见光晕的
   推导：条带画在卡片内缘 → 父层 blur 把颜色推过卡片边界 → 父层挖洞
   mask（content-box = 卡片区域）只放行卡片以外的部分。内缘的硬切被
   细线盖住，外缘切边在 extent 处而 blur 衰减已尽，两头都不可见。
   条带刻意不自转：旋转内容上的 blur 必须逐帧重跑，静态条带模糊一次
   后由合成器缓存，稳态零逐帧成本。 */
[data-composer-card] .rs-glow {
  display: none;
}

html[data-rainbow-glow] [data-composer-card] .rs-glow {
  display: block;
  position: absolute;
  /* 外扩 extent 给光晕留活动空间；padding 同值让 content-box 恰好回到卡片区域。 */
  inset: calc(-1 * var(--dsh-rainbow-glow-extent));
  padding: var(--dsh-rainbow-glow-extent);
  border-radius: inherit;
  filter: blur(var(--dsh-rainbow-glow-blur));
  /* 挖洞：卡片区域（content-box）抠掉，输入区不落一丝光。 */
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  pointer-events: none;
}

[data-composer-card] .rs-glow-band {
  position: absolute;
  /* inset extent 从 .rs-glow 的外扩框回到卡片边界，条带与细线同位。 */
  inset: var(--dsh-rainbow-glow-extent);
  border-radius: inherit;
  /* 比细线宽 2px：blur 会侵蚀条带边缘，加宽一点补回被侵蚀的亮度。 */
  padding: calc(var(--dsh-rainbow-width) + 2px);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  /* 强度落在条带上而不是 .rs-glow 上：呼吸/脉冲动画动的是 .rs-glow 的
     opacity，放同层会被动画的 opacity 覆盖成 1。 */
  opacity: var(--dsh-rainbow-glow-opacity);
  background: conic-gradient(from 0deg, #38bdf8, #818cf8, #c084fc, #f472b6, #fb7185, #fb923c, #fbbf24, #a3e635, #34d399, #22d3ee, #38bdf8);
  pointer-events: none;
}

html[data-rainbow-palette=&quot;rainbow&quot;] [data-composer-card] .rs-conic,

html[data-rainbow-palette=&quot;peach&quot;] [data-composer-card] .rs-conic,

/* 配色方案：ocean。 */
html[data-rainbow-palette=&quot;ocean&quot;] [data-composer-card]::before {

html[data-rainbow-palette=&quot;ocean&quot;] [data-composer-card] .rs-conic,

/* 配色方案：cyberpunk。 */

html[data-rainbow-palette=&quot;cyberpunk&quot;] [data-composer-card] .rs-conic,

/* 配色方案：theme。 */
html[data-rainbow-palette=&quot;theme&quot;] [data-composer-card]::before {

}

html[data-rainbow-palette=&quot;theme&quot;] [data-composer-card] .rs-conic,
html[data-rainbow-palette=&quot;theme&quot;] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, var(--dsw-alias-button-info-fill), color-mix(in srgb, var(--dsw-alias-button-info-fill) 65%, white), color-mix(in srgb, var(--dsw-alias-button-info-fill) 72%, #0ea5e9), color-mix(in srgb, var(--dsw-alias-button-info-fill) 70%, black), var(--dsw-alias-button-info-fill));
}

/* 显示位置：仅顶边（mask 只保留顶部条带，颜色仍是环上对应弧段，随角度流动）。 */
html[data-rainbow-side=&quot;top&quot;] [data-composer-card]::before,
html[data-rainbow-side=&quot;top&quot;] [data-composer-card] .rs-ring {
  -webkit-mask: linear-gradient(180deg, #fff 0 var(--dsh-rainbow-width), transparent var(--dsh-rainbow-width));
  mask: linear-gradient(180deg, #fff 0 var(--dsh-rainbow-width), transparent var(--dsh-rainbow-width));
}

/* 仅顶边时柔光条带同步收成顶部条带（高度比细线多 2px，补 blur 侵蚀）。 */
html[data-rainbow-side=&quot;top&quot;] [data-composer-card] .rs-glow-band {
  -webkit-mask: linear-gradient(180deg, #fff 0 calc(var(--dsh-rainbow-width) + 2px), transparent calc(var(--dsh-rainbow-width) + 2px));
  mask: linear-gradient(180deg, #fff 0 calc(var(--dsh-rainbow-width) + 2px), transparent calc(var(--dsh-rainbow-width) + 2px));
}

/* 显示位置：仅底边。 */
html[data-rainbow-side=&quot;bottom&quot;] [data-composer-card]::before,
html[data-rainbow-side=&quot;bottom&quot;] [data-composer-card] .rs-ring {
  -webkit-mask: linear-gradient(180deg, transparent calc(100% - var(--dsh-rainbow-width)), #fff calc(100% - var(--dsh-rainbow-width)));
  mask: linear-gradient(180deg, transparent calc(100% - var(--dsh-rainbow-width)), #fff calc(100% - var(--dsh-rainbow-width)));
}

/* 仅底边时柔光条带同步收成底部条带。 */
html[data-rainbow-side=&quot;bottom&quot;] [data-composer-card] .rs-glow-band {
  -webkit-mask: linear-gradient(180deg, transparent calc(100% - var(--dsh-rainbow-width) - 2px), #fff calc(100% - var(--dsh-rainbow-width) - 2px));
  mask: linear-gradient(180deg, transparent calc(100% - var(--dsh-rainbow-width) - 2px), #fff calc(100% - var(--dsh-rainbow-width) - 2px));
}

/* 呼吸明暗：叠加在载体层上（opacity 走合成器）。 */
@keyframes dsh-rainbow-breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

html[data-rainbow-breathe] [data-composer-card]::before {
  animation: dsh-rainbow-breathe calc(var(--dsh-rainbow-period) * 2) ease-in-out infinite;
}

html[data-rainbow-breathe] [data-composer-card] .rs-ring {
  animation: dsh-rainbow-breathe calc(var(--dsh-rainbow-period) * 2) ease-in-out infinite;
}

/* 呼吸同频作用在柔光层上：opacity 动画叠加在条带的静态强度之上。 */
html[data-rainbow-breathe] [data-composer-card] .rs-glow {
  animation: dsh-rainbow-breathe calc(var(--dsh-rainbow-period) * 2) ease-in-out infinite;
}

/* 会话运行中：流动加速（状态桥把 running 投影到 <html data-rainbow-state>）。 */
html[data-rainbow-state=&quot;running&quot;] [data-composer-card] {
  --dsh-rainbow-period: 1.2s;
}

/* 审批等待：琥珀色配色 + 缓慢脉冲（pendingInteraction 由状态桥投影）。
   配色必须跟着状态走——颜色在这套产品里是语义（琥珀 = 需要你确认）。 */
html[data-rainbow-state=&quot;attention&quot;] [data-composer-card]::before,
html[data-rainbow-state=&quot;attention&quot;] [data-composer-card] .rs-conic,
html[data-rainbow-state=&quot;attention&quot;] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #f59e0b, #fbbf24, #fcd34d, #f59e0b, #d97706, #f59e0b);
}

html[data-rainbow-state=&quot;attention&quot;] [data-composer-card] .rs-conic {
  animation-duration: 3s;
}

/* 会话出错：红色警示配色 + 快速脉冲。 */
html[data-rainbow-state=&quot;error&quot;] [data-composer-card]::before,
html[data-rainbow-state=&quot;error&quot;] [data-composer-card] .rs-conic,
html[data-rainbow-state=&quot;error&quot;] [data-composer-card] .rs-glow-band {
  background: conic-gradient(from 0deg, #ef4444, #f87171, #fca5a5, #ef4444, #dc2626, #ef4444);
}

html[data-rainbow-state=&quot;error&quot;] [data-composer-card] .rs-conic {
  animation-duration: 1s;
}

@keyframes dsh-rainbow-error-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

html[data-rainbow-state=&quot;attention&quot;] [data-composer-card] .rs-ring {
  animation: dsh-rainbow-error-pulse 2s ease-in-out infinite;
}

html[data-rainbow-state=&quot;error&quot;] [data-composer-card] .rs-ring {
  animation: dsh-rainbow-error-pulse 1.2s ease-in-out infinite;
}

/* 状态脉冲同步到柔光层（opacity 动画，与条带强度相乘）。 */
html[data-rainbow-state=&quot;attention&quot;] [data-composer-card] .rs-glow {
  animation: dsh-rainbow-error-pulse 2s ease-in-out infinite;
}

html[data-rainbow-state=&quot;error&quot;] [data-composer-card] .rs-glow {
  animation: dsh-rainbow-error-pulse 1.2s ease-in-out infinite;
}

/* 回合完成庆祝：快转一圈并提亮回落（标记由状态桥 0.9s 后移除）。
   首尾 opacity 都等于常态 1，起止平滑。 */
@keyframes dsh-rainbow-celebrate {
  0% { opacity: 1; }
  40% { opacity: 1; }
  60% { opacity: 0.4; }
  100% { opacity: 1; }
}

html[data-rainbow-celebrate] [data-composer-card]::before {
  animation: dsh-rainbow-celebrate 0.9s ease-out 1;
}

html[data-rainbow-celebrate] [data-composer-card] .rs-conic {
  animation: dsh-rainbow-spin 0.9s linear 1;
}

html[data-rainbow-celebrate] [data-composer-card] .rs-ring {
  animation: dsh-rainbow-celebrate 0.9s ease-out 1;
}

/* 庆祝闪动与细线同帧落在柔光层上。 */
html[data-rainbow-celebrate] [data-composer-card] .rs-glow {
  animation: dsh-rainbow-celebrate 0.9s ease-out 1;
}

/* 输入框聚焦时环更亮更饱和，失焦平滑回落。
   柔光层的提亮加在 .rs-glow-band（子层）上——.rs-glow 自带 blur filter，
   在它上面再设 filter 会把 blur 顶掉，光晕瞬间变硬边。 */
[data-composer-card]:focus-within::before,
[data-composer-card]:focus-within .rs-ring,
[data-composer-card]:focus-within .rs-glow-band {
  filter: brightness(1.25) saturate(1.15);
}

/* 总开关关闭：隐藏伪元素、旋转图层与柔光层（偏好服务在 <html data-rainbow-off> 上打标记）。 */
html[data-rainbow-off] [data-composer-card]::before,
html[data-rainbow-off] [data-composer-card] .rs-ring,
html[data-rainbow-off] [data-composer-card] .rs-glow {
  display: none;
}

/* 用户开启&quot;减弱动态效果&quot;时停用全部动画，保留静态描边与静态光晕。 */
@media (prefers-reduced-motion: reduce) {
  [data-composer-card]::before {
    animation: none;
  }

  [data-composer-card] .rs-conic,
  [data-composer-card] .rs-ring,
  [data-composer-card] .rs-glow {
    animation: none !important;
  }
}

<script>

const root = document.documentElement
const setAttr = (id, attr) => {
  const el = document.getElementById(id)
  el.addEventListener('change', () => {
    if (el.value) root.dataset[attr] = el.value
    else delete root.dataset[attr]
  })
}
document.getElementById('glow').addEventListener('change', (e) => {
  if (e.target.checked) root.dataset.rainbowGlow = '1'; else delete root.dataset.rainbowGlow
})
setAttr('palette', 'rainbowPalette')
setAttr('side', 'rainbowSide')
setAttr('state', 'rainbowState')
document.getElementById('breathe').addEventListener('change', (e) => {
  if (e.target.checked) root.dataset.rainbowBreathe = '1'; else delete root.dataset.rainbowBreathe
})
const bindVar = (id, cssVar, unit = '') => {
  const el = document.getElementById(id)
  const out = document.getElementById(id + '-out')
  const apply = () => {
    root.style.setProperty(cssVar, el.value + unit)
    out.textContent = el.value + unit
  }
  el.addEventListener('input', apply)
  apply()
}
bindVar('width', '--dsh-rainbow-width', 'px')
bindVar('period', '--dsh-rainbow-period', 's')
bindVar('extent', '--dsh-rainbow-glow-extent', 'px')
bindVar('blur', '--dsh-rainbow-glow-blur', 'px')
bindVar('opacity', '--dsh-rainbow-glow-opacity')
document.getElementById('reverse').addEventListener('change', (e) => {
  root.style.setProperty('--dsh-rainbow-direction', e.target.checked ? 'reverse' : 'normal')
})
document.getElementById('celebrate').addEventListener('click', () => {
  root.dataset.rainbowCelebrate = '1'
  setTimeout(() => { delete root.dataset.rainbowCelebrate }, 950)
})
document.getElementById('reset').addEventListener('click', () => {
  for (const v of ['--dsh-rainbow-width', '--dsh-rainbow-period', '--dsh-rainbow-direction', '--dsh-rainbow-glow-extent', '--dsh-rainbow-glow-blur', '--dsh-rainbow-glow-opacity']) root.style.removeProperty(v)
  location.reload()
})

</script>
